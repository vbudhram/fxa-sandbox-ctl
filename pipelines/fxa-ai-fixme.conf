# fxa-ai-fixme.conf — the public mozilla/fxa ticket-to-PR pipeline.
#
# Everything §11 of AI_FIXME_PIPELINE.md lists as "hardcoded" lives here. A
# second project is a second file in this directory, selected with
# `fxa-sandbox-ctl --pipeline <name>`.
#
# Every value below is overridable by the matching environment variable, so a
# one-off run does not need an edit.

PIPE_REPO_SLUG="mozilla/fxa"
PIPE_REPO="${HOME}/Desktop/working2/fxa"

# The label family IS the state machine. The bare prefix is the queue label;
# every lifecycle state carries a suffix (ai-fixme-inflight, -done, ...).
PIPE_LABEL_PREFIX="ai-fixme"

# `labels = "x"` is an exact match in JQL, so this does not also match
# ai-fixme-inflight.
PIPE_QUEUE_JQL='labels = "ai-fixme" AND statusCategory != Done ORDER BY created ASC'

# Durable pass state: attempt counters, skip fingerprints, launch logs, the
# pass lock. Attempt counters MUST survive a reboot, so this cannot live under
# TMPDIR: macOS purges /var/folders and the caps would silently reset to zero.
PIPE_STATE_DIR="${HOME}/.claude/state/fxa-ai-fixme"

# Run telemetry. Reference only; nothing here reaches Jira or a PR.
PIPE_RUNS_FILE="${PIPE_REPO}/ai/docs/agent-runs.jsonl"
PIPE_COSTS_FILE="${PIPE_REPO}/ai/docs/agent-costs.json"

# Refuse to launch below this much free disk. A running agent VM takes 8-13GB,
# and this host filled to 99% on 2026-08-11.
PIPE_MIN_FREE_GB=25

# A run alive but writing nothing for this long is treated as stalled. Generous
# on purpose: a big ticket can be read for a while before the first edit, and a
# false stall costs a slot and a relaunch.
PIPE_STALL_MINUTES=20
# Launches a single pass may make. On tart it is 1: a bad context file must not
# burn both slots at once, and a slot is 8-13GB of local disk. On gce a slot is a
# directory and a runner costs $0.13 an hour, so a pass may fill every free slot.
# `launchcap` resolves this against the backend. On gce the pool grows to meet
# it: freeslots lists not-yet-created slots up to this many and launch creates
# them on demand, so this is also the number of concurrent gce runners.
PIPE_MAX_LAUNCHES_TART="${PIPE_MAX_LAUNCHES_TART:-1}"
PIPE_MAX_LAUNCHES_GCE="${PIPE_MAX_LAUNCHES_GCE:-5}"

# Agent runtime for launches from this pipeline: claude or codex.
# FXA_AGENT_RUNTIME in the environment, or --runtime on launch, wins.
PIPE_AGENT_RUNTIME="${PIPE_AGENT_RUNTIME:-claude}"

# VM backend for launches from this pipeline: tart or gce. --backend wins.
PIPE_VM_BACKEND="${PIPE_VM_BACKEND:-tart}"
