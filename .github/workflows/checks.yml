name: checks
on:
  push:
    branches: [main, 'improve/**']
  pull_request:
permissions:
  contents: read
jobs:
  ubuntu:
    # The manager VM's OS. The laptop runs the macOS half: skills/fxa-ctl-dev/test.sh mac.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
      # The bot tree, for the checks that read its text (symptoms.check.sh): without it they skip.
      - uses: actions/checkout@v4
        with:
          repository: vbudhram/fxa-agent-bot
          path: bot
      # apt runs only when one is missing. The image has no ffmpeg, so every run installs it. A good mirror fetches it in 3 s; a bad one trickles below every
      # apt timeout and failed the step at 15 min. Each try has a short limit, and a retry uses another mirror.
      - name: Packages (the same list as test.sh run_linux)
        timeout-minutes: 15
        run: |
          for c in git jq curl python3 openssl perl rsync ffmpeg; do command -v $c >/dev/null || miss=1; done
          [ -n "${miss:-}" ] || exit 0
          o=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          mirrors=("" http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/)
          for i in 0 1 2; do
            # The runner's sources read their mirror from this file (mirror+file:).
            [ -z "${mirrors[$i]}" ] || echo "${mirrors[$i]}" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo timeout 90 apt-get update -q "${o[@]}" \
              && sudo timeout 150 apt-get install -y -q --no-install-recommends "${o[@]}" git jq curl python3 openssl perl rsync ffmpeg ca-certificates \
              && exit 0
            echo "apt try $((i + 1)) failed"; sleep 5
          done
          exit 1
      # Only the last job runs the desktop gateway's check (test.sh, FXA_CHECK_SHARD).
      - name: The desktop gateway's packages, so test.sh runs its check
        if: matrix.shard == '3/3'
        run: python3 -m pip install -q --break-system-packages -r desktop-gateway/requirements.txt
      - name: Git identity for the checks that commit
        run: |
          git config --global user.email test@example.com
          git config --global user.name test
          git config --global init.defaultBranch main
      # The runner starts steps with SIGPIPE ignored, so `yes | head` exits 1, not 141, and
      # errors.check.sh sees a crash. A shell cannot reset an ignored signal itself.
      - run: env --default-signal=PIPE bash skills/fxa-ctl-dev/test.sh here
        env:
          FXA_CHECK_SHARD: ${{ matrix.shard }}
          FXA_BOT_REPO: ${{ github.workspace }}/bot
