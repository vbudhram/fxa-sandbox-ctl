<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FxA Agent</title>
<link rel="icon" id="favicon" href="/icon.png">
<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* FxA design tokens (libs/shared/assets tailwind.config.js), as fxa-settings applies them. */
  :root {
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px;
    --r-sm:4px; --r-lg:12px;
    --t-label:12px; --t-sub:13px; --t-body:14px; --t-head:18px; --t-huge:32px;

    --bg:#FAFAFB; --panel:#fff; --sunk:#F0F0F4; --line:#E7E7E7; --line2:#C2C2C2; --hover:#E7E7E7;
    --ink:#0C0C0D; --dim:#5E5E72; --faint:#6D6D6E;
    --ok:#00736C; --warn:#CC3D00; --bad:#C50042; --info:#0060DF; --purple:#7542E5; --link:#0060DF; --link-hover:#0250BB;
    --okbg:#E3FFF3; --warnbg:#FFF4DE; --badbg:#FFDFE7; --infobg:#E6EFFC;
    --amber:#FF7139; --lit:#E25920;
    --card-border:transparent; --shadow:0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
    --sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --head:Metropolis,Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  }
  :root { color-scheme:light dark; }
  :root[data-theme="light"] { color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0C0C0D; --panel:#15141A; --sunk:#1F1E25; --line:#32313C; --line2:#5E5E72; --hover:#32313C;
      --ink:#FAFAFB; --dim:#C2C2C2; --faint:#9E9E9E;
      --ok:#3FE1B0; --warn:#FFBD4F; --bad:#FF848B; --info:#00B3F4; --purple:#AB71FF; --link:#0090ED; --link-hover:#00B3F4;
      --okbg:#0E2A24; --warnbg:#2E2210; --badbg:#35141D; --infobg:#0B2340;
      --amber:#FF8A50; --lit:#FFA266;
      --card-border:#32313C; --shadow:none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#0C0C0D; --panel:#15141A; --sunk:#1F1E25; --line:#32313C; --line2:#5E5E72; --hover:#32313C;
    --ink:#FAFAFB; --dim:#C2C2C2; --faint:#9E9E9E;
    --ok:#3FE1B0; --warn:#FFBD4F; --bad:#FF848B; --info:#00B3F4; --purple:#AB71FF; --link:#0090ED; --link-hover:#00B3F4;
    --okbg:#0E2A24; --warnbg:#2E2210; --badbg:#35141D; --infobg:#0B2340;
    --amber:#FF8A50; --lit:#FFA266;
    --card-border:#32313C; --shadow:none;
  }
  * { box-sizing:border-box; }
  body { margin:0 auto; padding:var(--s4) var(--s4) 40px; max-width:1600px;
         background:var(--bg); color:var(--ink);
         font:var(--t-body)/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; border-radius:2px; }
  a:hover { text-decoration:underline; text-underline-offset:2px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  .stats a, .alert .what a { color:var(--link); text-decoration:underline; text-underline-offset:2px; }
  .stats a:hover { color:var(--link-hover); }
  .stats a b { color:inherit; }
  [hidden] { display:none !important; }


  /* ── status bar: one row, always visible ── */
  #status { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;
            padding:var(--s2) var(--s3); border-radius:var(--r-lg); margin-bottom:var(--s3);
            border:1px solid var(--card-border); box-shadow:var(--shadow); background:var(--panel); font-size:var(--t-sub); color:var(--dim); }
  #status h1 { font-size:var(--t-body); font-weight:650; margin:0; letter-spacing:-.01em; color:var(--ink); }
  #status h1 span { color:var(--faint); font-weight:400; }
  #cells { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
  #status .cell { display:inline-flex; align-items:baseline; gap:5px; white-space:nowrap; }
  #status .cell b { color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums; }
  #status .cell.bad b { color:var(--bad); }
  #status .cell.warn b { color:var(--warn); }
  #status .cell.ok b { color:var(--ok); }
  #status .sep { width:1px; height:14px; background:var(--line2); opacity:.6; }
  #status .spacer { flex:1; }
  .warnt { color:var(--warn); font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none; }
  .dot.warn { background:var(--warn); } .dot.dead { background:var(--bad); }
  #health { font-weight:650; color:var(--ok); } #health.warn { color:var(--warn); } #health.dead { color:var(--bad); }
  /* cta-neutral */
  button { font:600 var(--t-sub) var(--head); color:var(--ink); background:var(--bg);
           border:1px solid var(--line2); border-radius:var(--r-sm); padding:6px var(--s4); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--hover); }
  button:active { color:var(--faint); }

  /* ── alerts ── */
  #attn { display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s3); }
  #attn:empty { display:none; }
  .alert { display:flex; align-items:baseline; gap:var(--s3); padding:var(--s2) var(--s3);
           border-radius:var(--r-lg); border:1px solid; font-size:var(--t-sub); }
  .alert.bad  { color:var(--bad);  background:var(--badbg);  border-color:color-mix(in srgb,var(--bad) 25%,transparent); }
  .alert.warn { color:var(--warn); background:var(--warnbg); border-color:color-mix(in srgb,var(--warn) 25%,transparent); }
  .alert .what { color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .alert .fix { margin-left:auto; font-family:var(--mono); font-size:var(--t-label); padding:1px var(--s2);
                border-radius:var(--r-sm); background:var(--panel); border:1px solid currentColor; white-space:nowrap; }

  /* ── panels ── */
  .grid { display:grid; gap:var(--s3); grid-template-columns:1fr; align-items:start; }
  @media (min-width:900px) { .grid { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
  section { border:1px solid var(--card-border); box-shadow:var(--shadow); border-radius:var(--r-lg); background:var(--panel); padding:var(--s4) var(--s6); min-width:0; }
  section.wide { grid-column:1/-1; }
  h2 { font:700 16px/1.3 var(--head); margin:0 0 var(--s3); color:var(--ink);
       display:flex; align-items:baseline; gap:var(--s2); }
  h2 .n { font-size:var(--t-body); font-weight:700; color:var(--dim); font-variant-numeric:tabular-nums; }
  h2 .note { margin-left:auto; font:400 var(--t-sub) var(--sans); color:var(--faint); text-transform:none; }
  h2 .sub  { font:400 var(--t-sub) var(--sans); color:var(--faint); text-transform:none; }
  .empty { color:var(--faint); font-size:var(--t-sub); }
  .unknown { color:var(--warn); font-size:var(--t-sub); font-weight:600; }
  .headline { display:flex; align-items:baseline; gap:var(--s3); margin:0 0 var(--s3); }
  .headline .big { font-family:var(--head); font-size:var(--t-huge); font-weight:700; line-height:1; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }
  .headline .cap { color:var(--ink); }
  .headline .rest { color:var(--faint); font-size:var(--t-sub); margin-left:auto; }

  .item { padding:var(--s2) 0; }
  .item + .item { border-top:1px solid color-mix(in srgb,var(--line) 60%,var(--panel)); }
  .item:last-child { padding-bottom:0; }
  .line1 { display:grid; grid-template-columns:82px minmax(0,1fr) 152px; align-items:baseline; gap:var(--s3); }
  .line1 > :last-child { justify-self:start; }
  .line2 { color:var(--dim); font-size:var(--t-sub); margin-top:2px; display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
  .key { font-family:var(--mono); font-size:var(--t-sub); font-weight:600; color:var(--info); white-space:nowrap; }
  .title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .mono { font-family:var(--mono); font-size:var(--t-label); }

  .tag { font-size:var(--t-label); font-weight:600; padding:2px var(--s2); border-radius:999px;
         border:1px solid transparent; color:var(--dim); background:var(--sunk); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tag.ok { color:var(--ok); background:var(--okbg); } .tag.bad { color:var(--bad); background:var(--badbg); }
  .tag.warn { color:var(--warn); background:var(--warnbg); } .tag.info { color:var(--info); background:var(--infobg); }
  .tag.merged { color:var(--purple); background:color-mix(in srgb,var(--purple) 12%,var(--panel)); }
  .tag.run::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor;
                     margin-right:5px; vertical-align:1px; }
  .age { font-variant-numeric:tabular-nums; } .age.old { color:var(--bad); font-weight:650; }

  .checks { display:inline-flex; gap:2px; align-items:center; vertical-align:-2px; }
  .checks i { width:3px; height:11px; border-radius:1px; background:var(--ok); }
  .checks i.f { background:var(--bad); height:16px; } .checks i.r { background:var(--info); }

  details { margin-top:var(--s3); }
  details summary { cursor:pointer; color:var(--dim); font-size:var(--t-sub); list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details summary::before { content:"\25B8  "; color:var(--faint); }
  details[open] summary::before { content:"\25BE  "; }
  details .body { margin-top:var(--s2); padding-left:var(--s3); border-left:2px solid var(--line); }
  details .reason { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }

  /* ── agent cards ── */
  #s-agents.running { background:linear-gradient(180deg,#241f18,#1a1713); border-color:#4a4034; color:#ece7de; }
  #s-agents.running h2 { color:#b9b0a0; } #s-agents.running h2 .n { color:var(--amber); }
  #s-agents.running .title { color:#f2ede4; } #s-agents.running .stats { color:#b0a798; }
  #s-agents.running .term-body { background:#15120e; color:#c9c0b0; } #s-agents.running summary { color:#b0a798; }
  #s-agents.running .rail-lbl { color:#9b9284; }
  .fac { padding:var(--s3) 0; } .fac + .fac { border-top:1px solid var(--line); }
  .fac .top { display:grid; grid-template-columns:88px minmax(0,1fr) max-content; gap:var(--s3); align-items:baseline; }
  .fac .top .key { color:var(--info); } #s-agents.running .fac .top .key { color:var(--lit); } .fac .top .title { font-weight:500; }
  .fac .top .tags { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .rail { display:flex; align-items:center; margin:var(--s3) 0 var(--s2); max-width:600px; }
  .rail .node { display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; }
  .rail .box { width:15px; height:15px; border-radius:3px; background:var(--sunk); border:1px solid var(--line2); display:grid; place-items:center; }
  .rail .box i { width:5px; height:5px; border-radius:1px; background:var(--line2); }
  .rail .node.done .box { border-color:color-mix(in srgb,var(--ok) 55%,var(--line2)); } .rail .node.done .box i { background:var(--ok); }
  .rail .node.now .box { border-color:var(--amber); box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 22%,transparent); }
  .rail .node.now .box i { background:var(--amber); animation:forge 1.6s ease-in-out infinite; }
  @keyframes forge { 0%,100%{opacity:1} 50%{opacity:.35} }
  .rail .node.fail .box { border-color:var(--bad); } .rail .node.fail .box i { background:var(--bad); }
  .rail-lbl { font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
  .rail .node.now .rail-lbl { color:var(--amber); font-weight:700; } .rail .node.done .rail-lbl { color:var(--dim); }
  .rail .seg { flex:1; height:4px; min-width:14px; margin:0 3px 13px; border-radius:2px; background:var(--sunk);
               border:1px solid var(--line); overflow:hidden; position:relative; }
  .rail .seg::before { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--line2) 70%,transparent) 0 4px,transparent 4px 10px); background-size:10px 100%; }
  .rail .seg.done::before { background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ok) 55%,transparent) 0 4px,transparent 4px 10px); background-size:10px 100%; }
  .rail .seg.moving::before { animation:belt 800ms linear infinite; } @keyframes belt { to { background-position:10px 0; } }
  .rail .seg.jammed::before { background:repeating-linear-gradient(115deg,color-mix(in srgb,var(--bad) 45%,transparent) 0 5px,transparent 5px 10px); }
  .stats { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; font-size:var(--t-sub); color:var(--dim); }
  .stats b { color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums; }
  #s-agents.running .stats b { color:var(--lit); }
  .stats .add { color:var(--ok); } .stats .del { color:var(--bad); }
  .stats .sep { width:1px; height:11px; background:var(--line2); opacity:.6; }
  .stats .last { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:72ch; display:inline-block; vertical-align:bottom; }
  .fac details { margin-top:var(--s2); }
  .fac details.hist summary { font:500 var(--t-sub) var(--sans); color:var(--dim); }
  .fac summary { font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .term-body { margin-top:var(--s2); background:var(--sunk); color:var(--dim); border:1px solid var(--line); border-radius:var(--r-sm);
               padding:var(--s2); max-height:clamp(96px,20vh,170px); overflow:auto; overscroll-behavior:contain;
               font-family:var(--mono); font-size:11px; line-height:1.45; white-space:pre; }
  .chat { max-height:55vh; overflow:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:var(--s2); }
  .msg { border:1px solid var(--line); border-radius:var(--r-sm); padding:var(--s2) var(--s3); background:var(--sunk);
         font-size:var(--t-sub); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { background:var(--infobg); border-color:color-mix(in srgb,var(--info) 25%,transparent); margin-right:15%; }
  .msg.agent { margin-left:15%; }
  .msg.action { background:transparent; border-style:dashed; color:var(--dim); text-align:center; }
  .msg .who { display:block; font-size:var(--t-label); font-weight:650; color:var(--dim); margin-bottom:2px; white-space:normal; }
  .msg .who span { font-weight:400; color:var(--faint); margin-left:var(--s2); }
  .waiting { display:grid; grid-template-columns:88px minmax(0,1fr) max-content; gap:var(--s3); align-items:baseline;
             padding:var(--s2) 0; font-size:var(--t-sub); border-top:1px solid var(--line); }

  /* ── pool and runners ── */
  .slot { display:grid; grid-template-columns:96px minmax(60px,1fr) max-content; align-items:center; gap:var(--s3); padding:var(--s2) 0; }
  .slot + .slot { border-top:1px solid color-mix(in srgb,var(--line) 60%,var(--panel)); }
  .slot .nm { font-family:var(--mono); font-size:var(--t-sub); }
  .slot .meter { height:6px; border-radius:3px; background:var(--sunk); overflow:hidden; }
  .slot .meter i { display:block; height:100%; width:0; border-radius:3px; }
  .slot.free .meter { background:transparent; border:1px dashed var(--line2); }
  .slot.virtual .meter { background:transparent; border:1px dotted var(--line); }
  .slot.virtual .nm { color:var(--faint); }
  .slot.busy .meter i { width:100%; background:var(--info); opacity:.7; }
  .slot.held .meter i { width:100%; background:var(--warn); opacity:.45; }
  .slot.over .meter i { width:100%; background:var(--bad); opacity:.6; }
  .slot .r { display:flex; gap:5px; align-items:center; }

  /* ── app shell: side navigation, one view at a time ── */
  .app { display:grid; grid-template-columns:196px minmax(0,1fr); gap:var(--s4); align-items:start; }
  .app > * { min-width:0; }
  nav { position:sticky; top:var(--s4); display:flex; flex-direction:column; gap:2px; }
  nav { font-family:var(--head); }
  nav h1 { font-size:var(--t-head); font-weight:700; margin:0 0 var(--s3); padding:0 var(--s3); }
  nav h1 { display:flex; align-items:center; gap:var(--s2); }
  nav h1 img { flex:none; }
  nav h1 #repo { display:block; color:var(--faint); font:400 var(--t-sub) var(--sans); }
  nav a { display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3); border-radius:var(--r-sm);
          color:var(--dim); font-weight:500; }
  nav a:hover { text-decoration:none; background:var(--hover); color:var(--ink); }
  nav a.on { background:var(--sunk); color:var(--link); font-weight:700; }
  nav a .n { margin-left:auto; font-size:var(--t-label); font-weight:650; font-variant-numeric:tabular-nums;
             padding:0 var(--s2); border-radius:999px; background:var(--sunk); color:var(--dim); }
  nav a .n:empty { display:none; }
  nav a .n.bad { background:var(--badbg); color:var(--bad); } nav a .n.warn { background:var(--warnbg); color:var(--warn); }
  nav a .n.info { background:var(--infobg); color:var(--info); }
  nav .theme { display:inline-flex; margin-top:var(--s2); }
  nav .theme button { padding:3px var(--s2); font-size:var(--t-label); border-radius:0; margin-left:-1px; }
  nav .theme button:first-child { border-radius:var(--r-sm) 0 0 var(--r-sm); margin-left:0; }
  nav .theme button:last-child { border-radius:0 var(--r-sm) var(--r-sm) 0; }
  nav .theme button[aria-pressed="true"] { background:var(--sunk); color:var(--link); font-weight:700; }
  nav .fresh { margin-top:var(--s4); padding:var(--s3); border-top:1px solid var(--line); font-size:var(--t-label);
               color:var(--faint); display:flex; flex-direction:column; align-items:flex-start; gap:var(--s2); }
  [data-views]:not(.on) { display:none !important; }
  body[data-view="overview"] section[data-empty="true"] { display:none !important; }
  .tabs { display:flex; gap:var(--s1); grid-column:1/-1; border-bottom:1px solid var(--line); }
  .tabs a { padding:var(--s2) var(--s3); color:var(--dim); font-weight:500; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabs a:hover { text-decoration:none; color:var(--ink); }
  .tabs a { font-family:var(--head); }
  .tabs a.on { color:var(--link); font-weight:700; border-bottom-color:var(--link); }
  .tabs a .n { font-size:var(--t-label); color:var(--faint); margin-left:var(--s1); font-variant-numeric:tabular-nums; }
  .tiles { display:grid; gap:var(--s3); grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:var(--s3); }
  @media (max-width:1000px) { .tiles { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  @media (max-width:600px) { .tiles { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .tile { border:1px solid var(--card-border); box-shadow:var(--shadow); border-radius:var(--r-lg); background:var(--panel); padding:var(--s3) var(--s4); display:block; }
  .tile:hover { text-decoration:none; box-shadow:0 2px 14px rgb(58 57 68 / .2); }
  .tile .big { font-family:var(--head); font-size:28px; font-weight:700; line-height:1.1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .tile .lbl { font:600 var(--t-sub) var(--head); color:var(--dim); }
  .tile .sub { font-size:var(--t-sub); color:var(--faint); }
  .tile.bad .big { color:var(--bad); } .tile.warn .big { color:var(--warn); } .tile.ok .big { color:var(--ok); }
  @media (max-width:800px) {
    .app { grid-template-columns:minmax(0,1fr); }
    nav { position:static; flex-direction:row; overflow-x:auto; gap:var(--s1); }
    nav h1 { display:none; }
    nav a { white-space:nowrap; }
    nav .fresh { margin:0 0 0 auto; padding:0 var(--s2); border:0; flex-direction:row; align-items:center; white-space:nowrap; }
  }

  /* ── overview: what needs you, what is running ── */
  .ov { grid-column:1/-1; display:grid; gap:var(--s3); grid-template-columns:minmax(0,3fr) minmax(0,2fr); align-items:start; }
  @media (max-width:900px) { .ov { grid-template-columns:minmax(0,1fr); } }
  .need { display:flex; align-items:center; gap:var(--s3); padding:var(--s3) 0; border-top:1px solid var(--sunk); }
  .need .chip { width:92px; flex:none; text-align:center; font-size:var(--t-label); font-weight:700; padding:2px 0; border-radius:999px; }

<div class="app">

<script>
"use strict";
const JIRA = "https://mozilla-hub.atlassian.net/browse/";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ago = s => s == null ? "never" : s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s/60)}m ago`
  : s < 172800 ? `${Math.round(s/3600)}h ago` : `${Math.round(s/86400)}d ago`;
const short = s => s == null ? "" : s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s/60)}m` : `${(s/3600).toFixed(1)}h`;
const stamp = e => e == null ? "" : new Date(e * 1000).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
const days = iso => iso == null ? null : (Date.now() - Date.parse(iso)) / 86400000;
const jira = k => `<a class="key" href="${JIRA}${encodeURIComponent(k)}" target="_blank" rel="noreferrer">${esc(k)}</a>`;
const prl = (repo, n) => `<a class="key" href="https://github.com/${encodeURI(repo)}/pull/${n}" target="_blank" rel="noreferrer">#${n}</a>`;
const TICKET = /^[A-Z][A-Z0-9]+-\d+$/;
const usd = n => n == null ? "—" : "$" + Number(n).toFixed(2);

const LAST = {};
function put(id, html) {
  if (LAST[id] === html) return false;
  LAST[id] = html;
  const node = document.getElementById(id);
  const closed = new Set([...node.querySelectorAll("details")].filter(d => !d.open && d.dataset.k).map(d => d.dataset.k));
  node.innerHTML = html;
  node.querySelectorAll("details").forEach(d => { if (d.dataset.k && closed.has(d.dataset.k)) d.open = false; });
  return true;
}
const sentence = t => t.charAt(0).toUpperCase() + t.slice(1);
function head(title, n, note, sub) {
  return `<h2>${sentence(title)}${sub ? `<span class="sub">${sub}</span>` : ""}${n != null ? `<span class="n">${n}</span>` : ""}${note ? `<span class="note">${note}</span>` : ""}</h2>`;
}
const titled = t => `<span class="title" title="${esc(t ?? "")}">${esc(t ?? "")}</span>`;

function checkBars(r) {
  const total = (r.ok ?? 0) + (r.fail ?? 0) + (r.running ?? 0);
  if (total === 0) return "";
  const scale = total > 30 ? 30 / total : 1, w = n => n > 0 ? Math.max(1, Math.round(n * scale)) : 0;
  const label = `${r.ok} passed, ${r.fail} failed, ${r.running} running`;
  return `<span class="checks" role="img" aria-label="${esc(label)}" title="${esc(label)}">${
    "<i class='f'></i>".repeat(w(r.fail)) + "<i class='r'></i>".repeat(w(r.running)) + "<i></i>".repeat(w(r.ok))}</span>`;
}
const hasChecks = r => ((r.ok ?? 0) + (r.fail ?? 0) + (r.running ?? 0)) > 0;
function verdictTag(r) {
  if (r.pr == null)                     return `<span class="tag warn">no PR</span>`;
  if (r.state === "MERGED")             return `<span class="tag merged">merged</span>`;
  if (r.state === "CLOSED")             return `<span class="tag warn">closed</span>`;
  if (r.draft)                          return `<span class="tag">draft</span>`;
  if (r.review === "CHANGES_REQUESTED") return `<span class="tag bad">changes requested</span>`;
  if (r.fail > 0 && r.infra)            return `<span class="tag warn" title="${esc(r.infra)}">infra red</span>`;
  if (r.fail > 0)                       return `<span class="tag bad">${r.fail} failing</span>`;
  if (r.running > 0)                    return `<span class="tag run info">${r.running} running</span>`;
  if (!hasChecks(r))                    return `<span class="tag">no checks yet</span>`;
  if (r.mergeable === "CONFLICTING")    return `<span class="tag bad">conflicts</span>`;
  if (r.review === "APPROVED")          return `<span class="tag ok">approved</span>`;
  return `<span class="tag ok">green</span>`;
}
function waitAge(r) {
  const h = r.last_human_review;
  const since = h ? days(h.at) : days(r.created ?? r.updated);
  if (since == null) return "";
  const who = h ? `since ${esc(h.login)}'s review` : "no human review yet";
  const req = (r.reviewers ?? []).map(x => esc(x.replace(/^mozilla\//, ""))).join(", ");
  return `<span class="age${since >= 3 ? " old" : ""}">${Math.round(since)}d</span><span>${who}</span>${req ? `<span>· requested ${req}</span>` : ""}`;
}
const isWaitingOnHuman = r => r.pr && r.state === "OPEN" && !r.draft && r.fail === 0 && r.running === 0 &&
  hasChecks(r) && r.mergeable !== "CONFLICTING" && r.review !== "APPROVED" && r.review !== "CHANGES_REQUESTED";

// ── the agent's own output, on its own cadence ──
const TAILS = {}; let TAIL_KEYS = [];
function paintTail(key, isLive) {
  const lane = document.getElementById("lane-term-" + key);
  if (lane) {
    const body = lane.querySelector(".body"), lines = TAILS[key] || [], next = lines.join("\n");
    lane.querySelector(".hdr").textContent = lines.length ? `agent output · live · ${lines.length} of max 200 lines` : "agent output · waiting…";
    // A redraw replaces the panel; LANE_SCROLL keeps a reader's place above the newest line.
    if (body.textContent !== next) body.textContent = next;
    body.scrollTop = LANE_SCROLL[key] ?? body.scrollHeight;
  }
  const el = document.getElementById("term-" + key); if (!el) return;
  const body = el.querySelector(".body"), hdr = el.querySelector(".hdr"), lines = TAILS[key] || [];
  const next = lines.join("\n");
  if (hdr) hdr.textContent = lines.length
    ? (isLive ? "agent output · live · " : "final output · ") + (lines[lines.length - 1] || "").trim().slice(0, 120)
    : (isLive ? "agent output · waiting…" : "no output captured");
  if (body.textContent === next) return;
  const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 24;
  body.textContent = next;
  if (atBottom) body.scrollTop = body.scrollHeight;
}
async function pollTails(keys) {
  for (const k of keys) {
    try {
      const r = await (await fetch(`/api/tail?key=${encodeURIComponent(k)}`, { cache:"no-store" })).json();
      if (r && Array.isArray(r.lines)) { TAILS[k] = r.lines; paintTail(k, true); }
    } catch {}
  }
}

// ── the conveyor: boot sub-steps are real steps now ──
const BOOT = ["boot","checkout","hardening","config","launching"];
const STAGES = [["starting","boot"],["watching","agent"],["squashing","squash"],["pushed","push"],["pr","PR"],["ci","CI"]];
function rail(t) {
  const failed = t.stage === "error" || t.stage === "stalled";
  let i = STAGES.findIndex(x => x[0] === t.stage);
  if (t.stage === "stalled") i = 1;
  if (t.stage === "pr") i = t.pr ? 5 : 4;
  if (i < 0) i = 0;
  const ciDone = t.pr && t.fail === 0 && t.running === 0 && hasChecks(t);
  const live = t.live || (t.stage === "pr" && t.pr && t.running > 0);
  return `<div class="rail">${STAGES.map(([id, lbl], n) => {
    const cls = failed ? (n === i ? "fail" : n < i ? "done" : "") : n < i ? "done" : n === i ? (id === "ci" && ciDone ? "done" : "now") : "";
    const seg = ["seg"]; if (failed && n >= i) seg.push("jammed"); else if (n < i) seg.push("done"); if (live && n === i) seg.push("moving");
    const label = n === 0 && t.stage === "starting" && t.detail ? esc(t.detail) : lbl;

// One card per runner (fast feed) merged with its ticket row (slow feed).
function card(t) {
  const a = t.agent || {};
  const stalled = t.stage === "stalled", failed = t.stage === "error";
  const stat = t.diffstat || "", ins = stat.match(/(\d+) insertion/), del = stat.match(/(\d+) deletion/);
  const idle = a.idle_seconds ?? null;
  const status = t.ci ? (t.fail > 0 ? `<span class="tag bad">${t.fail} failing</span>`
      : t.running > 0 ? `<span class="tag run info">CI ${t.running} running</span>`
      : t.pr ? `<span class="tag ok">CI green</span>` : `<span class="tag info">PR opening</span>`)
    : stalled ? `<span class="tag bad">stalled · ${esc((t.detail || "").split(" ")[0])}</span>`
    : failed ? `<span class="tag bad">run failed</span>`
    : t.stage === "starting" ? `<span class="tag run info">${esc(t.detail || "boot")}</span>`
    : t.stage === "squashing" || t.stage === "pushed" ? `<span class="tag run info">${esc(t.stage)}</span>`
    : !t.agent_alive ? `<span class="tag bad">agent exited</span>`
    : idle != null && idle >= 300 ? `<span class="tag warn">idle ${short(idle)}</span>`
    : `<span class="tag run ok">working</span>`;
  const base = t.base_ok === true ? `<span class="tag ok" title="sandbox is on the slot's commit">base ok</span>`
    : t.base_ok === false ? `<span class="tag bad" title="sandbox and slot are on different commits">base mismatch</span>` : "";
  const cost = a.cost_usd ?? a.cost_so_far;
  return `<div class="fac">
    <div class="top">${jira(t.key)}${titled(t.summary || t.branch)}
      <span class="tags">${(t.attempts ?? 0) > 0 ? `<span class="tag warn">attempt ${t.attempts + 1}</span>` : ""}${base}
        <span class="tag">${short(t.elapsed_seconds)}</span>${status}</span></div>
    ${rail(t)}
    <div class="stats">
      ${t.pr ? `${prl(SNAP?.repo ?? "", t.pr)} ${checkBars(t)}<span class="sep"></span>` : ""}
      ${t.ci ? `<span><b>${t.committed_files ?? t.files_changed ?? 0}</b> file${(t.committed_files ?? t.files_changed) === 1 ? "" : "s"} committed</span>` :
      `<span><b>${t.files_changed ?? 0}</b> file${t.files_changed === 1 ? "" : "s"} touched</span>`}
      ${ins ? `<span class="add">+${ins[1]}</span>` : ""}${del ? `<span class="del">−${del[1]}</span>` : ""}
      ${t.handoff ? `<span class="tag ok">handoff written</span>` : ""}
      ${a.turns != null ? `<span class="sep"></span><span><b>${a.turns}</b> turns</span>` : ""}
      ${cost != null && cost > 0 ? `<span><b>${usd(cost)}</b>${a.cost_usd == null ? " so far" : ""}</span>` : ""}
      ${idle != null && t.agent_alive ? `<span>last event ${short(idle)} ago</span>` : ""}
      ${a.num_turns === 0 ? `<span class="tag bad">goal rejected</span>` : ""}
      ${a.is_error === true ? `<span class="tag bad">run error</span>` : ""}
      ${t.ci ? `<span class="tag">sandbox released</span>` : `<span class="sep"></span><span class="mono">${esc(t.name)} · ${esc(t.slot)}</span>`}
    </div>
    ${a.last_text || a.last_tool ? `<div class="stats"><span class="last" title="${esc(a.last_tool || "")}">${esc(a.last_text || a.last_tool)}</span></div>` : ""}
    ${failed && t.detail ? `<div class="stats" style="color:var(--bad)">${esc(t.detail)}</div>` : ""}
    ${t.ci ? "" : `<details data-k="term-${esc(t.key)}" id="term-${esc(t.key)}"><summary><span class="hdr"></span></summary><div class="term-body body"></div></details>`}
  </div>`;
}

let SNAP = null, AGENTS = null, STATE = {};

function merged() {
  // runners from the fast feed, decorated with the ticket row from the slow feed
  const inflight = SNAP?.inflight ?? [], runners = AGENTS?.runners ?? [];
  const byKey = Object.fromEntries(inflight.map(t => [t.key, t]));
  const cards = runners.map(r => {
    const t = byKey[r.key] || {};
    return { ...t, ...r, live: r.agent_alive && r.stage !== "pr", summary: t.summary, attempts: t.attempts, pr: t.pr, ok: t.ok, fail: t.fail, running: t.running };
  });
  const seen = new Set(runners.map(r => r.key));
  // Inflight with no runner: at the PR stage the runner is gone by design and
  // CI is the live phase, so it keeps its card and the belt runs on the CI
  // segment. Anything else without a runner is a fault and gets an alert.
  const waiting = inflight.filter(t => !seen.has(t.key));
  const ciCards = waiting.filter(t => t.stage === "pr").map(t => ({ ...t, live: false, ci: true,
    name: "", slot: "", agent: null, agent_alive: false, elapsed_seconds: t.elapsed_seconds }));
  return { cards: cards.concat(ciCards), waiting: waiting.filter(t => t.stage !== "pr") };
}

let NEEDS = [];
function renderAlerts() {
  const s = SNAP, g = AGENTS, alerts = [], h = s?.health ?? {}, repo = s?.repo ?? "";
  const add = (cls, subj, what, fix) => alerts.push(`<div class="alert ${cls}">${subj}<span class="what">${what}</span>${fix ? `<span class="fix">${esc(fix)}</span>` : ""}</div>`);
  // Ticket-level items: urgency first (lower sorts first), each with one link out.

  const staleFeed = (name, age, every) => age != null && every && age > 3 * every &&

  else if (sp > 1500) add("warn", `<b class="key">pass</b>`, `last pass ${ago(sp)}; the cron fires every 20 minutes`);

    if (a.num_turns === 0) need(0, "Goal rejected", "bad", title, `${t.key} · the rendered prompt is over 4000 chars`, tix(t.key), "View ticket");
  });

    else if (r.review === "CHANGES_REQUESTED") need(3, "Changes", "bad", title, `${r.key} · #${r.pr} · changes requested`, pr(r.pr), "View PR");
    else if (isWaitingOnHuman(r)) need(5 - Math.min(d, 30) / 100, "Review", d >= 3 ? "warn" : "dim", title, `${r.key} · #${r.pr} · ${r.last_human_review ? `since ${r.last_human_review.login}'s review` : "no human review"} in ${d} day${d === 1 ? "" : "s"}`, pr(r.pr), "View PR");

    if (!owned && v.age_seconds > 120) add("warn", `<span class="key">${esc(v.name)}</span>`, `${esc(v.state)} with no run behind it (${short(v.age_seconds)} old); it bills until deleted`, `fxa-sandbox-ctl stop ${v.name.replace(/^agent-/, "")}`);

  });

// Pipeline lanes: one belt per ticket, from queue to merge. Runners come from

const LANE_ST = ["Queue","Boot","Agent","Squash","Push","PR","CI","Review","Merged"];

const LANE_OUT = {}; let OUT_ALL = true;
try { OUT_ALL = localStorage.getItem("laneOutput") !== "off"; } catch {}
function laneRows() {
  const { cards } = merged(), med = SNAP?.telemetry?.median_minutes, rows = [], seen = new Set();
  cards.forEach(t => {
    seen.add(t.key);
    const a = t.agent || {}, min = Math.round((t.elapsed_seconds ?? 0) / 60);
    if (t.ci) {
      const kind = t.fail > 0 ? (t.infra ? "warn" : "fix") : t.running > 0 ? "live" : "wait";
      rows.push({ t, st: 6, kind, l1: t.fail > 0 ? `${t.fail} failing` : t.running > 0 ? `CI ${t.running} running` : "CI green", l2: "", checks: true });
      return;
    }
    const st = { starting:1, watching:2, stalled:2, error:2, squashing:3, pushed:4, pr:5 }[t.stage] ?? 2;
    const kind = t.stage === "stalled" || t.stage === "error" ? "fix" : "live";
    const l1 = t.stage === "starting" ? `Boot: ${t.detail || "starting"}` : t.stage === "stalled" ? `Stalled · ${(t.detail || "").split(" ")[0]}`
      : t.stage === "error" ? "Run failed" : t.stage === "squashing" ? "Squashing" : t.stage === "pushed" ? "Pushing" : t.stage === "pr" ? "Opening PR"
      : plainMd(a.last_tool || a.last_text || "Working");
    const l2 = st === 2 && kind === "live" ? `${min}m${med ? ` of a ${med}m median` : ""} · ${t.files_changed ?? 0} files` : `${min}m`;
    rows.push({ t, st, kind, l1, l2, runner: !t.ci && t.agent_alive, late: med && st === 2 && min > med });
  });

    const d = Math.round(days(r.last_human_review?.at ?? r.created) ?? 0);
    let st = 7, kind = "wait", l1 = `Waiting ${d} day${d === 1 ? "" : "s"}`, l2 = r.last_human_review ? `${r.last_human_review.login} reviewed` : "no human review";
    if (r.state === "MERGED") { st = 8; kind = "done"; l1 = "Merged"; l2 = "drain pending"; }
    else if (r.state === "CLOSED") { st = 8; kind = "wait"; l1 = "Closed"; l2 = "not merged"; }
    else if (r.mergeable === "CONFLICTING") { st = 6; kind = "fix"; l1 = r.fail > 0 && r.infra ? "Conflicts + infra red" : "Conflicts"; l2 = `${d}d open`; }
    else if (r.fail > 0) { st = 6; kind = r.infra ? "warn" : "fix"; l1 = r.infra ? "Infra red" : `${r.fail} failing`; l2 = r.infra ? r.infra : `${d}d open`; }
    else if (r.running > 0) { st = 6; kind = "live"; l1 = `CI ${r.running} running`; }
    else if (r.review === "CHANGES_REQUESTED") { kind = "fix"; l1 = "Changes requested"; }

// The conversation loads when opened and refreshes on each poll while open.
const HIST = {}, HIST_OPEN = new Set();

function renderTickets() {

    (review == null ? "" : review.length === 0 ? `<div class="empty">nothing awaiting review</div>`
     : waiting.slice().sort(byWait).map(row).join("") +
       (others.length ? `<h2 style="margin-top:var(--s4)">Not waiting on a reviewer<span class="n">${others.length}</span><span class="note">CI red, conflicts, or changes requested</span></h2>` +
         others.slice().sort(byWait).map(row).join("") : "")));

  const q = s.queue ?? {}, ready = q.ready ?? [], skipped = q.skipped ?? [];
  const liveSkips = skipped.filter(k => k.in_queue !== false), staleSkips = skipped.filter(k => k.in_queue === false);
  put("s-queue", head("queue", q.fetch_failed ? "?" : ready.length + liveSkips.length, q.fetch_failed ? "" : `${ready.length} launchable`, "labelled ai-fixme") +
    (q.fetch_failed ? `<div class="unknown">Jira fetch failed; unknown, not zero</div>`
     : (s.mode?.newtickets === "off" ? `<div class="empty">intake is off: the passes work on open PRs only and launch nothing from this queue</div>` +
          (ready.length ? `<details data-k="launchable"><summary>${ready.length} launchable, oldest first</summary><div class="body">${
            ready.map(t => `<div class="item"><div class="line1">${jira(t.key)}${titled(t.summary)}<span></span></div></div>`).join("")}</div></details>` : "")
     : ready.length === 0 ? `<div class="empty">nothing launchable right now</div>`
        : ready.slice(0, 5).map((t, i) => `<div class="item"><div class="line1">${jira(t.key)}${titled(t.summary)}<span>${i === 0 ? `<span class="tag info">next up</span>` : ""}</span></div></div>`).join("") +
          (ready.length > 5 ? `<div class="empty" style="padding-top:var(--s2)">+ ${ready.length - 5} more launchable</div>` : "")) +
       (liveSkips.length ? `<details data-k="skipped"><summary>${liveSkips.length} skipped, and why</summary><div class="body">${
          liveSkips.slice().sort((a, b) => a.passes - b.passes).map(k => `<div class="item"><div class="line1">${jira(k.key)}${titled(k.summary)}<span class="tag">${k.passes}×</span></div>
             <div class="line2 reason" title="${esc(k.reason)}">${esc(k.reason)}</div></div>`).join("")}</div></details>` : "") +
       (staleSkips.length ? `<div class="empty" style="padding-top:var(--s2)">${staleSkips.length} stale skip record${staleSkips.length > 1 ? "s" : ""} (${staleSkips.map(k => esc(k.key)).join(", ")}); left the queue (resolved or unlabelled); pruned on the next reconcile</div>` : "")));

  const t = s.telemetry;
  put("footer", (t ? `<span>all time: <b>${t.runs}</b> runs</span><span><b>${t.tickets}</b> tickets</span><span><b>${usd(t.cost_usd)}</b> spend</span>
      <span>median <b>${t.median_minutes}m</b></span><span>last recorded ${esc((t.last_recorded || "").slice(0, 10))}</span>` : `<span>no run telemetry yet</span>`) +
    `<span style="flex:1"></span><span>tickets snapshot took ${s.took_seconds}s</span>`);
}

function renderPool() {
  const g = AGENTS; if (!g) return;
  const pool = g.pool ?? [], free = g.free_slots ?? [], inst = g.instances ?? [];
  const { cards } = merged();
  const runnerByName = Object.fromEntries(inst.map(v => [v.name, v]));
  const cardByName = Object.fromEntries(cards.map(c => ["agent-" + c.name, c]));
  const rows = pool.map(p => {
    const busy = !!p.agent, v = p.agent ? runnerByName["agent-" + p.agent] : null;
    const c = p.agent ? cardByName["agent-" + p.agent] : null;
    const over = v && v.max_seconds && v.age_seconds >= v.max_seconds;
    const cls = over ? "over" : busy ? "busy" : free.includes(p.slot) ? "free" : "held";
    const holder = TICKET.test(p.key ?? "") ? p.key : null;
    return `<div class="slot ${cls}"><span class="nm">${esc(p.slot)}</span><span class="meter"><i></i></span>
      <span class="r">${busy ? `${jira(holder || p.agent)}${v ? `<span class="tag ${over ? "bad" : "info"}">${short(v.age_seconds)}${over ? " · over cap" : ""}</span>` : ""}${
          c?.agent?.cost_so_far ? `<span class="tag">${usd(c.agent.cost_so_far)}</span>` : ""}`
        : cls === "free" ? `<span class="tag ok">free</span>` : holder ? `<span class="tag warn">on ${esc(holder)}</span>` : `<span class="tag">on ${esc(p.branch ?? "—")}</span>`}</span></div>`;
  });
  const virtual = free.filter(f => !pool.some(p => p.slot === f)).map(f => `<div class="slot virtual"><span class="nm">${esc(f)}</span><span class="meter"><i></i></span><span class="tag">created on launch</span></div>`);
  const sessionKeys = new Set((g.sessions ?? []).map(x => x.key));
  const orphans = inst.filter(v => !pool.some(p => "agent-" + p.agent === v.name)).map(v => {
    const key = v.name.replace(/^agent-/, "");
    return sessionKeys.has(key)
      ? `<div class="slot busy"><a class="nm" href="#sessions/live" title="${esc(v.name)}">${esc(key)}</a><span class="meter"><i></i></span><span class="tag info">session · ${short(v.age_seconds)}</span></div>`
      : `<div class="slot held"><span class="nm">${esc(v.name)}</span><span class="meter"><i></i></span><span class="tag warn">no slot · ${esc(v.state)} · ${short(v.age_seconds)}</span></div>`;
  });
  put("s-pool", head("pool", `${free.length}/${pool.length + virtual.length}`, `${inst.length} sandbox${inst.length === 1 ? "" : "es"} up`, "slots and sandboxes") +
    (rows.length + virtual.length + orphans.length === 0 ? `<div class="empty">no pool worktrees found</div>` : rows.join("") + virtual.join("") + orphans.join("")));
}

function renderToday() {
  const g = AGENTS, t = g?.today;
  put("s-today", head("today", t ? String(t.runs) : "?", "", "runs recorded since 00:00 UTC") +
    (!t ? `<div class="empty">no run log yet</div>`
     : `<div class="stats" style="gap:var(--s4)">
          <span><b>${t.prs}</b> PR${t.prs === 1 ? "" : "s"} opened</span>
          <span><b>${t.tickets}</b> ticket${t.tickets === 1 ? "" : "s"}</span>
          <span><b>${usd(t.cost_usd)}</b> spent</span>
          ${t.median_minutes != null ? `<span>median <b>${t.median_minutes}m</b></span>` : ""}
          <span class="sep"></span><span>runners now <b>${usd(g.runner_hourly_usd)}</b>/h</span>
          <span>agents feed took ${g.took_seconds}s</span></div>`));
}

// The icon, with a status dot in the corner when something is wrong.
const ICON = new Image(); ICON.src = "/icon.png";
let FAV_DOT;
function paintFavicon(dot) {
  if (dot === FAV_DOT && document.getElementById("favicon").href.startsWith("data:")) return;
  if (!ICON.complete) { ICON.onload = () => paintFavicon(dot); return; }
  FAV_DOT = dot;
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"); g.drawImage(ICON, 0, 0, 64, 64);
  if (dot) { g.beginPath(); g.arc(50, 50, 13, 0, 2 * Math.PI); g.fillStyle = dot; g.fill(); g.lineWidth = 4; g.strokeStyle = "#fff"; g.stroke(); }
  document.getElementById("favicon").href = c.toDataURL("image/png");
}

// The tab says what needs you, so a background tab is worth glancing at.
function renderTab() {
  const n = (SNAP?.review ?? []).filter(isWaitingOnHuman).length;
  const bad = document.querySelectorAll("#attn .alert.bad").length;
  const level = document.getElementById("dot").className.replace("dot", "").trim();
  document.title = `${n ? `(${n}) ` : ""}${bad ? "⚠ " : ""}FxA Agent`;
  paintFavicon({ dead:"#C50042", warn:"#FFA436" }[level]);
}

// Overview tiles and sidebar counts: one number per view, each links to it.
function renderNav() {
  const { cards } = merged(), ss = AGENTS?.sessions ?? [];
  const liveS = ss.filter(s => LIVE_SESSION.includes(s.state)).length;
  const waiting = SNAP?.review ? SNAP.review.filter(isWaitingOnHuman).length : null;
  const q = SNAP?.queue, queued = q && !q.fetch_failed ? (q.ready ?? []).length : null;
  const bad = document.querySelectorAll("#attn .alert.bad").length + NEEDS.filter(n => n.cls === "bad").length, alerts = document.querySelectorAll("#attn .alert").length + NEEDS.length;
  const free = AGENTS?.free_slots?.length, runners = (AGENTS?.instances ?? []).filter(v => v.state === "running").length;
  const badge = (id, n, cls) => { const e = document.getElementById(id); e.textContent = n ? n : ""; e.className = "n" + (cls ? " " + cls : ""); };
  badge("n-overview", alerts, bad ? "bad" : "warn");
  badge("n-pipeline", waiting, "info");
  badge("n-sessions", liveS, "info");
  badge("n-runners", AGENTS ? runners : "", "");
  const tile = (href, lbl, big, sub, cls = "") => `<a class="tile ${cls}" href="${href}"><div class="lbl">${sentence(lbl)}</div><div class="big">${big ?? "?"}</div><div class="sub">${sub}</div></a>`;
  const rv = SNAP?.review ?? [], open = rv.filter(r => r.state === "OPEN");
  const oldest = Math.max(0, ...rv.filter(isWaitingOnHuman).map(r => Math.round(days(r.last_human_review?.at ?? r.created) ?? 0)));
  const conflicts = open.filter(r => r.mergeable === "CONFLICTING").length, infra = open.filter(r => r.fail > 0 && r.infra).length;
  const fix = open.filter(r => r.mergeable === "CONFLICTING" || r.fail > 0 || r.review === "CHANGES_REQUESTED").length;
  const t = SNAP?.telemetry;
  put("s-tiles", [
    tile("#pipeline", "waiting on review", waiting, waiting ? `oldest waits ${oldest} day${oldest === 1 ? "" : "s"}` : "none waiting", waiting ? "warn" : ""),
    tile("#pipeline", "needs a fix", SNAP ? fix : null, [infra && `${infra} infra red`, conflicts && `${conflicts} conflicts`].filter(Boolean).join(" · ") || "nothing red", fix ? "bad" : ""),
    tile("#sessions/live", "sessions", AGENTS ? `${liveS}/${AGENTS.session_cap}` : null, `${ss.filter(s => s.state === "paused").length} paused, a reply resumes`),
    tile("#stats", "all-time spend", t ? usd(t.cost_usd) : null, t ? `${t.runs} runs · ${t.tickets} tickets · median ${t.median_minutes} min` : ""),
  ].join(""));
}

const VIEWS = ["overview", "pipeline", "sessions", "stats", "runners"];
let SESS_TAB = "live", SESS_SEL = "";
function route() {
  const [v, sub, sel] = location.hash.slice(1).split("/");
  const view = VIEWS.includes(v) ? v : "overview", tab = ["paused", "stopped"].includes(sub) ? sub : "live";
  SESS_TAB = tab; SESS_SEL = /^agent-[a-z0-9]{4,12}$/.test(sel ?? "") ? sel : "";
  if (view === "sessions" && AGENTS) renderSess();
  if (view === "stats") loadStats();
  document.querySelectorAll("[data-views]").forEach(e => {
    const vs = e.dataset.views.split(" ");
    e.classList.toggle("on", vs.includes(view) || vs.includes(`${view}:${tab}`));
  });
  document.body.dataset.view = view;
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === view));
  document.querySelectorAll(".tabs a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
}
window.addEventListener("hashchange", route);
route();

function render() {
  renderStatus(); renderAlerts(); renderAgents(); renderSessions(); renderTickets(); renderLanes(); renderNeeds(); renderRunning(); renderSess();
  renderPool(); renderToday(); renderNav(); renderTab();
  if (document.body.dataset.view === "stats") loadStats();
}

async function poll() {
  let data;
  try { data = await (await fetch("/api/snapshot", { cache:"no-store" })).json(); }
  catch { document.getElementById("dot").className = "dot dead"; document.getElementById("age").textContent = "server unreachable"; return; }
  SNAP = data.snapshot; AGENTS = data.agents; STATE = data;
  render();
  HIST_OPEN.forEach(loadHist);
}
// Theme: System follows the OS; Light and Dark are kept in this browser only.
function paintTheme() {
  const t = document.documentElement.dataset.theme || "system";
  document.querySelectorAll("[data-theme-set]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
}
document.querySelectorAll("[data-theme-set]").forEach(b => b.addEventListener("click", () => {
  const t = b.dataset.themeSet;
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { t === "system" ? localStorage.removeItem("theme") : localStorage.setItem("theme", t); } catch {}
  paintTheme();
}));
paintTheme();
document.getElementById("refresh").addEventListener("click", async () => {
  try { await fetch("/api/refresh"); } catch {}
  setTimeout(poll, 1500);
});
poll();
setInterval(poll, 15000);
setInterval(() => pollTails(TAIL_KEYS), 5000);
</script>
</body>
