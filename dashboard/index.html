<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FxA Agent</title>
<link rel="icon" id="favicon" href="/icon.png">
<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  /* Design tokens: the Graphite scheme, cool greys with a teal accent, in light and dark. */
  :root {
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px;
    --r-sm:4px; --r-md:8px; --r-lg:14px; --r-pill:999px;
    --t-tiny:11px; --t-label:12px; --t-sub:13px; --t-body:14px; --t-heading:16px; --t-head:18px; --t-page:22px; --t-kpi:28px; --t-huge:32px;

    --bg:#f6f8fa; --panel:#ffffff; --sunk:#eef1f4; --line:#d8dee4; --line2:#8c959f; --hover:#eef1f4;
    --ink:#1f2328; --dim:#4b535d; --faint:#59636e;
    --ok:#187a34; --warn:#9a5b00; --bad:#cf222e; --info:#0969da; --purple:#8250df; --link:#0b7380; --link-hover:#075861;
    --okbg:#dafbe1; --warnbg:#fff4d6; --badbg:#ffebe9; --infobg:#ddf4ff;
    --amber:#bf8700;
    --chart-1:#5683c8; --chart-2:#d27552; --chart-3:#2e9f7c; --chart-4:#b0802a; --chart-5:#a35d9e; --chart-muted:#8c959f;   /* chart series, in fixed order; never the status colours */
    --card-border:#d8dee4; --shadow:0 1px 2px rgb(31 35 40 / .06);
    --shadow-hover:0 2px 14px rgb(58 57 68 / .2); --shadow-pop:0 10px 30px rgb(0 0 0 / .25);
    --shadow-drawer:0 0 30px rgb(0 0 0 / .18); --shadow-dialog:0 20px 60px rgb(0 0 0 / .3);
    /* The terminal is dark in both themes. */
    --tty-bg:#0C0C0D; --tty-bar:#1F1E25; --tty-line:#32313C; --tty-ink:#E7E7E7; --tty-dim:#9E9E9E; --tty-muted:#6D6D6E;
    --tty-prompt:#3FE1B0; --tty-tool:#00B3F4; --tty-bad:#FF848B; --tty-opt:#FFD567;
    /* FxA dropped Metropolis and Inter in 2024 (FXA-9058): the system stack, for body and headings */
    --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",sans-serif;
    --head:var(--sans);
    --purpletxt:#6639ba; --purplebg:#f3ebff; --on-strong:#ffffff;   /* purple-700 on purple-50; text on a solid badge */
    --rail:72px; --side:300px; --right:340px;

  }
  :root { color-scheme:light dark; }
  :root[data-theme="light"] { color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1b1f24; --panel:#22272e; --sunk:#2a3038; --line:#333b45; --line2:#6b7682; --hover:#2c333c;
      --ink:#e6edf3; --dim:#b8c2cc; --faint:#959fab;
      --ok:#5fc98f; --warn:#e3b341; --bad:#f07178; --info:#6cb6ff; --purple:#b392f0; --link:#4fc3c7; --link-hover:#7fd8db;
      --okbg:#1c3226; --warnbg:#33290f; --badbg:#3a1f23; --infobg:#1d2f45;
      --amber:#e3b341;
    --chart-1:#5d89cf; --chart-2:#c46d4b; --chart-3:#2f977a; --chart-4:#b48632; --chart-5:#b46eaf; --chart-muted:#6b7682;
      --card-border:#333b45; --shadow:none; --purpletxt:#c4a8f5; --purplebg:#2e2645; --on-strong:#1b1f24;
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#1b1f24; --panel:#22272e; --sunk:#2a3038; --line:#333b45; --line2:#6b7682; --hover:#2c333c;
    --ink:#e6edf3; --dim:#b8c2cc; --faint:#959fab;
    --ok:#5fc98f; --warn:#e3b341; --bad:#f07178; --info:#6cb6ff; --purple:#b392f0; --link:#4fc3c7; --link-hover:#7fd8db;
    --okbg:#1c3226; --warnbg:#33290f; --badbg:#3a1f23; --infobg:#1d2f45;
    --amber:#e3b341;
    --chart-1:#5d89cf; --chart-2:#c46d4b; --chart-3:#2f977a; --chart-4:#b48632; --chart-5:#b46eaf; --chart-muted:#6b7682;
    --card-border:#333b45; --shadow:none; --purpletxt:#c4a8f5; --purplebg:#2e2645; --on-strong:#1b1f24;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; overflow:hidden;
         background:var(--bg); color:var(--ink);
         font:var(--t-body)/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; border-radius:2px; }
  a:hover { text-decoration:underline; text-underline-offset:2px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  .alert .what a { color:var(--link); text-decoration:underline; text-underline-offset:2px; }
  .sb-panel a, .right .rh a { color:var(--link); }
  .stats a:hover { color:var(--link-hover); }
  [hidden] { display:none !important; }

  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); } .dot.bad, .dot.dead { background:var(--bad); }
  .dot.info { background:var(--info); } .dot.done { background:var(--purple); } .dot.dim, .dot.paused { background:var(--faint); }
  .dot.live { animation:pulse 1.6s ease-in-out infinite; }

  .health { font-weight:650; color:var(--ok); } .health.warn { color:var(--warn); } .health.dead { color:var(--bad); } .health.paused { color:var(--dim); }
  /* cta-neutral */
  button { font:600 var(--t-sub) var(--head); color:var(--ink); background:var(--bg);
           border:1px solid var(--line2); border-radius:var(--r-sm); padding:6px var(--s4); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--hover); }
  button:active { color:var(--faint); }

  /* ── alerts ── */
  #attn { display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s3); }
  #attn:empty { display:none; }
  .alert { display:flex; align-items:baseline; gap:var(--s3); padding:var(--s2) var(--s3);
           border-radius:var(--r-lg); border:1px solid; font-size:var(--t-sub); }
  .alert.bad  { color:var(--bad);  background:var(--badbg);  border-color:color-mix(in srgb,var(--bad) 25%,transparent); }

  .alert .what { color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }

                border-radius:var(--r-sm); background:var(--panel); border:1px solid currentColor; white-space:nowrap; }

  .card { border:1px solid var(--card-border); box-shadow:var(--shadow); border-radius:var(--r-lg); background:var(--panel); padding:var(--s4) var(--s6); min-width:0; }
  .card.sm { padding:var(--s3) var(--s4); } .card.flat { box-shadow:none; border-color:var(--line); }
  a.card { display:block; color:inherit; } a.card:hover { text-decoration:none; box-shadow:var(--shadow-hover); }
  .card.bad { border-color:var(--bad); } .card.warn { background:var(--warnbg); }
  .wide { grid-column:1/-1; }

       display:flex; align-items:baseline; gap:var(--s2); }
  .card * + h2 { margin-top:var(--s4); }
  h2 .n { font-size:var(--t-body); font-weight:700; color:var(--dim); font-variant-numeric:tabular-nums; }
  h2 .note { margin-left:auto; font:400 var(--t-sub) var(--sans); color:var(--faint); text-transform:none; }
  h2 .sub  { font:400 var(--t-sub) var(--sans); color:var(--faint); text-transform:none; }
  /* Three heading levels: h2 (heading), h3 (subheading) and the overline. */
  h3 { font:700 var(--t-body)/1.3 var(--head); margin:0 0 var(--s2); color:var(--ink); }
  .overline, .sgroup, .right h4, .bgh, .sbh { font:600 var(--t-label)/1.5 var(--head); text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .empty { color:var(--faint); font-size:var(--t-sub); }
  .unknown { color:var(--warn); font-size:var(--t-sub); font-weight:600; }
  .headline { display:flex; align-items:baseline; gap:var(--s3); margin:0 0 var(--s3); }
  .headline .big { font-family:var(--head); font-size:var(--t-huge); font-weight:700; line-height:1; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }
  .headline .cap { color:var(--ink); }

  .item { padding:var(--s2) 0; }
  .item + .item { border-top:1px solid color-mix(in srgb,var(--line) 60%,var(--panel)); }

  .line1 > :last-child { justify-self:start; }
  .line2 { color:var(--dim); font-size:var(--t-sub); margin-top:2px; display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
  .key { font-family:var(--mono); font-size:var(--t-sub); font-weight:600; color:var(--info); white-space:nowrap; }
  .title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .mono { font-family:var(--mono); font-size:var(--t-label); }

  .tag { font-size:var(--t-label); font-weight:600; padding:2px var(--s2); border-radius:var(--r-pill);
         border:1px solid transparent; color:var(--dim); background:var(--sunk); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tag.ok { color:var(--ok); background:var(--okbg); } .tag.bad { color:var(--bad); background:var(--badbg); }
  .tag.warn { color:var(--warn); background:var(--warnbg); } .tag.info { color:var(--info); background:var(--infobg); }
  .tag.merged { color:var(--purpletxt); background:var(--purplebg); } .tag.dim { color:var(--dim); background:var(--sunk); }
  .tag.sq { border-radius:var(--r-sm); padding:0 5px; font-size:var(--t-tiny); }
  .tag.run.live::before { animation:pulse 1.6s ease-in-out infinite; }
  .tag.run::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor;
                     margin-right:5px; vertical-align:1px; }
  .age { font-variant-numeric:tabular-nums; } .age.old { color:var(--bad); font-weight:650; }

  .checks { display:inline-flex; gap:2px; align-items:center; vertical-align:-2px; }
  .checks i { width:3px; height:11px; border-radius:1px; background:var(--ok); }
  .checks i.f { background:var(--bad); height:16px; } .checks i.r { background:var(--info); }

  details { margin-top:var(--s3); }
  details summary { cursor:pointer; color:var(--dim); font-size:var(--t-sub); list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details summary::before { content:"\25B8  "; color:var(--faint); }
  details[open] summary::before { content:"\25BE  "; }
  details .body { margin-top:var(--s2); padding-left:var(--s3); border-left:2px solid var(--line); }
  details .reason { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }

  /* ── shell: left rail, list, main, details, status bar ── */
  .shell { height:100vh; display:grid; grid-template-rows:minmax(0,1fr) 32px;
           grid-template-columns:var(--rail) var(--side) minmax(0,1fr) var(--right);
           grid-template-areas:"rail side main right" "status status status status"; }
  body.noside .shell, body.v-overview .shell, body.v-pipeline .shell, body.v-runners .shell, body.bare .shell { --side:0px; }
  body.noright .shell, body.v-overview .shell, body.v-pipeline .shell, body.v-stats .shell, body.v-teams .shell, body.bare .shell, body.noitem .shell { --right:0px; }
  body.noside .side, body.v-overview .side, body.v-pipeline .side, body.v-runners .side, body.bare .side,
  body.noright .right, body.v-overview .right, body.v-pipeline .right, body.v-stats .right, body.v-teams .right, body.bare .right, body.noitem .right { display:none; }
  .rail { grid-area:rail; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:var(--s3) 0; gap:2px; z-index:11; }
  .rail .logo { width:40px; height:40px; margin-bottom:var(--s3); }
  .rail a, .rail button.rb { position:relative; width:60px; min-height:52px; padding:8px 0 6px; border-radius:var(--r-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
           color:var(--dim); font:600 var(--t-label)/1 var(--sans); background:none; border:0; }
  .rail a:hover, .rail button.rb:hover { text-decoration:none; background:var(--hover); color:var(--ink); }
  .rail a[aria-current] { color:var(--link); background:var(--sunk); font-weight:700; }   /* fxa-settings .nav-active */
  .rail svg { width:20px; height:20px; }
  .rail .n { position:absolute; top:2px; right:6px; min-width:18px; height:18px; padding:0 5px; border-radius:var(--r-pill); font:700 var(--t-label)/18px var(--sans); text-align:center; background:var(--sunk); color:var(--dim); }
  .rail .n:empty { display:none; }
  .rail .n.bad { background:var(--bad); color:var(--on-strong); } .rail .n.info { background:var(--info); color:var(--on-strong); } .rail .n.warn { background:var(--warn); color:var(--on-strong); }
  .rail .grow { flex:1; }
  .side { grid-area:side; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .side .sh { padding:var(--s4) var(--s4) var(--s2); }
  .side .sh h2 { margin:0; font-size:var(--t-body); }
  .search { margin-top:var(--s3); display:flex; align-items:center; gap:6px; border:1px solid var(--line2); border-radius:var(--r-md); padding:0 10px; background:var(--panel); color:var(--dim); }
  .search:focus-within { border-color:var(--link); }
  .search input { flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; padding:8px 0; outline:none; }
  kbd { font:600 var(--t-label) var(--mono); color:var(--dim); border:1px solid var(--line2); border-radius:3px; padding:0 4px; }
  .slist2 { overflow:auto; padding:0 var(--s2) var(--s3); flex:1; }
  .slist2 ul { list-style:none; margin:0; padding:0; }
  .sgroup { padding:var(--s3) var(--s2) 4px; margin:0; }
  .si { width:100%; text-align:left; display:grid; grid-template-columns:10px minmax(0,1fr); gap:2px var(--s2); align-items:baseline; padding:8px var(--s2);
        border:0; border-radius:var(--r-md); background:none; font:inherit; font-weight:400; color:inherit; cursor:pointer; }
  .si:hover { background:var(--hover); }
  .si[aria-current] { background:var(--infobg); box-shadow:inset 3px 0 0 var(--info); }
  .si[aria-current] .m { color:var(--dim); }
  .si.cur { outline:2px solid var(--link); outline-offset:-2px; }
  .si .dot { align-self:center; }
  @keyframes pulse { 50% { opacity:.4; } }
  .si .t { font-size:var(--t-body); font-weight:600; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.35; }
  .si .m { grid-column:2; font-size:var(--t-label); color:var(--faint); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .main { grid-area:main; overflow:auto; min-width:0; }
  .mh { position:sticky; top:0; z-index:5; background:var(--bg); padding:var(--s4) var(--s6) 0; }
  .mh .row { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
  .mh h1 { margin:0; font:700 var(--t-page)/1.2 var(--sans); }
  .mh .vsub { color:var(--faint); }
  .mh .acts { margin-left:auto; display:flex; gap:6px; }
  .iconbtn { width:36px; height:36px; padding:0; display:grid; place-items:center; border-radius:var(--r-md); color:var(--dim); }
  .iconbtn svg { width:18px; height:18px; } .iconbtn.lbl { width:auto; display:flex; gap:6px; padding:0 12px; }
  .mc { padding:var(--s4) var(--s6) var(--s6); }
  /* Drag handles on the sidebars' inner edges: drag to resize, double-click for the default. */
  .rsz { width:8px; height:100%; z-index:6; cursor:col-resize; touch-action:none; background:transparent; transition:background .15s; }
  .rsz:hover, .rsz.on { background:var(--line); }
  .rsz-side { grid-area:side; justify-self:end; margin-right:-4px; }
  .rsz-right { grid-area:right; justify-self:start; margin-left:-4px; }
  body.noside .rsz-side, body.v-overview .rsz-side, body.v-pipeline .rsz-side, body.v-runners .rsz-side, body.bare .rsz-side,
  body.noright .rsz-right, body.v-overview .rsz-right, body.v-pipeline .rsz-right, body.v-stats .rsz-right, body.v-teams .rsz-right, body.bare .rsz-right, body.noitem .rsz-right { display:none; }
  @media (max-width:1280px) { .rsz-right { display:none; } }
  @media (max-width:900px) { .rsz-side { display:none; } }
  /* Teams pages (epic i275) */
  .tpage { display:flex; flex-direction:column; gap:var(--s4); max-width:1100px; }
  .th { font:700 var(--t-page)/1.25 var(--sans); margin:0; display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; } .th:focus { outline:none; } .th:focus-visible { outline:2px solid var(--link); }
  .tsub { color:var(--dim); margin:0; } .tkey { font:400 var(--t-label) var(--mono); color:var(--faint); margin-left:var(--s2); } .thead .tkey { margin:4px 0 0; }
  .ttabs { display:flex; gap:var(--s1); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .ttab { padding:var(--s2) var(--s3); color:var(--dim); text-decoration:none; border-bottom:2px solid transparent; font-weight:600; min-height:40px; display:inline-flex; align-items:center; gap:6px; }
  .ttab[aria-current] { color:var(--link); border-color:var(--link); }
  .tcard.req { outline:2px solid var(--warn); }
  .tscroll { overflow-x:auto; padding:0; } .warnt { color:var(--warn); } .nowrap { white-space:nowrap; }
  .table { width:100%; border-collapse:collapse; font-size:var(--t-sub); }
  .table th { text-align:left; font-size:var(--t-label); font-weight:600; color:var(--dim); padding:var(--s2) var(--s3); border-bottom:1px solid var(--line); white-space:nowrap; }
  .table td { padding:var(--s2) var(--s3); border-bottom:1px solid var(--line); vertical-align:middle; } .table tr:last-child td, .table tr.tot td { border-bottom:0; }
  /* .num right-aligns one cell; .figures right-aligns every column after the first. */
  .table .num, .table.figures :is(th, td):not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .table.dense { font-size:var(--t-label); } .table.dense :is(th, td) { padding:3px 4px; }
  .table tr.sel td { background:var(--infobg); } .table tr.sel td:first-child { box-shadow:inset 3px 0 0 var(--info); }
  .num { font-variant-numeric:tabular-nums; } .tname { display:inline-flex; align-items:center; gap:var(--s2); font-weight:600; color:var(--ink); text-decoration:none; }
  .tbud { min-width:180px; } .tbud .meter { margin-top:4px; }
  .tbanner { display:flex; gap:var(--s3); align-items:center; flex-wrap:wrap; justify-content:space-between; background:var(--warnbg); border:1px solid var(--warn); border-radius:var(--r-lg); padding:var(--s3) var(--s4); }
 
  .sbdone h2 { font:700 var(--t-body)/1.3 var(--head); margin:0 0 var(--s2); display:flex; gap:var(--s3); align-items:baseline; } .sbd-scroll { overflow-x:auto; } .sbd-scroll .table td { white-space:nowrap; } .sbd-for { max-width:28ch; overflow:hidden; text-overflow:ellipsis; } .sbd-more { display:flex; gap:var(--s4); margin-top:var(--s2); font-size:var(--t-sub); }
  .tcards4 { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:var(--s2); } .tcards3 { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:var(--s2); }
  .tcols { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:var(--s4); }
  .titem { display:flex; justify-content:space-between; gap:var(--s3); padding:var(--s2) 0; border-bottom:1px solid var(--line); font-size:var(--t-sub); min-width:0; } .titem:last-child { border-bottom:0; } .titem > span:first-child { min-width:0; overflow-wrap:anywhere; }

<script>
"use strict";
// Links come from the snapshot's team block and fail closed: a bad site, repo, key or number gives plain text.
const REPO_RE = /^(?!.*\.\.)[\w-][\w.-]*\/[\w-][\w.-]*$/;
function teamRepo() { const r = SNAP?.team?.repo ?? SNAP?.repo ?? ""; return REPO_RE.test(r) ? r : ""; }
function jiraHref(k) { const s = String(SNAP?.team?.jira_site ?? "").replace(/\/+$/, ""); return /^https:\/\/[\w-]+(\.[\w-]+)+(:\d+)?$/.test(s) && /^[A-Z][A-Z0-9]+-\d+$/.test(k ?? "") ? `${s}/browse/${encodeURIComponent(k)}` : ""; }
function prUrl(n) { const r = teamRepo(); return r && /^\d+$/.test(String(n ?? "")) ? `https://github.com/${r}/pull/${n}` : ""; }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
// Components: the design system's parts, built with html``, which escapes every value it is given.
// html`` escapes each ${value} unless the value is an html`` result; an array joins, and null, undefined and false give nothing.
class Html { constructor(s) { this.s = s; } toString() { return this.s; } }
const raw = s => s instanceof Html ? s : new Html(String(s ?? ""));
const htmlVal = v => v == null || v === false ? "" : v instanceof Html ? v.s : Array.isArray(v) ? v.map(htmlVal).join("") : esc(v);
const html = (strs, ...vals) => new Html(strs.reduce((out, s, i) => out + s + (i < vals.length ? htmlVal(vals[i]) : ""), ""));
// A class list from words and {word: on} maps: cls("tag", tone, { run: true }).
const cls = (...xs) => xs.flatMap(x => x && typeof x === "object" ? Object.keys(x).filter(k => x[k]) : x ? [x] : []).join(" ");
// tone: ok, warn, bad, info, merged, dim. run draws the running dot, live pulses it, sq is the square form.
const tag = (text, tone, { run, live, sq, title, href } = {}) => href
  ? html`<a class="${cls("tag", tone, { run, live, sq })}" href="${href}"${title ? html` title="${title}"` : ""} target="_blank" rel="noreferrer">${text}</a>`
  : html`<span class="${cls("tag", tone, { run, live, sq })}"${title ? html` title="${title}"` : ""}>${text}</span>`;
// tone: ok, warn, bad, info, done, dim, or none for idle; live pulses.
const dot = (tone, live) => html`<span class="${cls("dot", tone, { live })}" aria-hidden="true"></span>`;
// pct is clamped to 0 to 100; label, when given, names the bar for a screen reader.
const meter = (pct, tone, label) => html`<span class="meter"${label ? html` role="img" aria-label="${label}"` : html` aria-hidden="true"`}><i${tone ? html` class="${tone}"` : ""} style="width:${Math.max(0, Math.min(100, Math.round(pct) || 0))}%"></i></span>`;
// body is HTML: pass an html`` result. sm and flat are the design system's sizes; tone is warn or bad.
const card = (body, { sm, flat, tone, cls: more, href } = {}) => href
  ? html`<a class="${cls("card", { sm, flat }, tone, more)}" href="${href}">${raw(body)}</a>`
  : html`<div class="${cls("card", { sm, flat }, tone, more)}">${raw(body)}</div>`;
// A label and value row; value is text or an html`` result; na marks a missing value.
const kvRow = (label, value, na) => html`<div class="kv"><span>${label}</span><b${na ? html` class="na"` : ""}>${value}</b></div>`;
// head: column labels, or [label, "num"] for a right-aligned one. rows: <tr> rows as html`` results. figures right-aligns every column after the first.
const table = (head, rows, { figures, dense, cls: more } = {}) => html`<table class="${cls("table", { figures, dense }, more)}"><thead><tr>${head.map(c => Array.isArray(c) ? html`<th class="${c[1]}">${c[0]}</th>` : html`<th>${c}</th>`)}</tr></thead><tbody>${[].concat(rows).map(raw)}</tbody></table>`;

  const steps = Array.isArray(sj) ? sj.filter(x => x && typeof x === "object") : [], peak = pj && typeof pj === "object" && !Array.isArray(pj) && (n(pj.load1) != null || n(pj.mem_mb) != null) ? pj : null;
  // The Sessions tab from the session record: the row's state is display text ('working', 'stopping').
  const sk = r.session || r.key, sx = (AGENTS?.sessions ?? []).find(s => s.key === sk);
  const sh = open && sessHref(sk) ? `#sessions/${sx ? sessTabOf(sx) : "stopped"}/${sk}` : "", pr = open ? prHref(r.pr) : "";
  const team = open && TEAM_RE.test(r.team || "") ? html`<a href="#teams/${routine ? "routines/" : ""}${r.team}">${r.team}</a>` : "";
  return keep(html`<h2 class="rh">${name}<small>${routine ? "Routine run" : "Slack session"}</small></h2><div class="sb-panel"><h4>Sandbox</h4>
    ${kvRow("State", r.state || "unknown")}${kvRow("Where", r.where || "unknown")}${up != null ? kvRow("Up for", `${short(up)}${cap ? ` of ${short(cap)}` : ""}`) : ""}
    ${n(r.boot_s) != null ? kvRow("Boot", `${Math.round(n(r.boot_s))} s${r.where ? ` · ${r.where}` : ""}`) : kvRow("Boot", "not recorded yet", 1)}
    ${steps.length ? html`<ol class="sbsteps">${steps.map(x => html`<li><span>${x.step}</span><b>${n(x.s) != null ? `${n(x.s)} s` : "—"}</b></li>`)}</ol>` : ""}
    ${peak ? kvRow("Peak load, memory, disk", `${peak.load1} · ${n(peak.mem_mb) != null ? (n(peak.mem_mb) / 1024).toFixed(1) : "?"} GB · ${peak.disk_pct}%`) : kvRow("Peak load, memory, disk", "not recorded yet", 1)}
    ${team ? kvRow("Team", team) : ""}</div>
    ${sh || pr ? html`<div class="sb-panel"><h4>Links</h4>${sh ? html`<p><a href="${sh}">Open the session</a></p>` : ""}${pr ? html`<p><a href="${pr}" target="_blank" rel="noopener">${pr.split("/").slice(-3).join("/")}</a></p>` : ""}</div>` : ""}`);
}
// A selected row that left the tab (it ended, or the tab changed): clear it, close the drawer, and put the focus in the list.
function sbClearGone() {
  delete SEL.runners; document.body.classList.remove("showright");
  const a = document.activeElement, right = document.getElementById("right"), list = document.getElementById("sb-list");
  if (list && (!a || a === document.body || right?.contains(a))) { if (!list.hasAttribute("tabindex")) list.setAttribute("tabindex", "-1"); list.focus(); }
  renderHeader();
}
function renderRight() {
  const el = document.getElementById("right"); let body = "";
  if (VIEW === "errors" && !SEL[VIEW]) SEL[VIEW] = sideGroups()[0]?.items[0]?.id;
  if (VIEW === "sessions") { const s = currentSession(); if (s) body = sessionDetails(s); }
  else if (VIEW === "errors") { const e = (ERRS ?? []).find(x => x.sig === SEL.errors);
    if (e) body = String(html`${raw(closeBtn)}<h2 class="rh">Error<small>${e.sig}</small></h2><div><h4>Signature</h4>${kvRow("Status", e.status)}${kvRow("Source", `${e.source}/${e.kind}`)}${kvRow("Where", e.where)}
      ${kvRow("Seen", `${e.count} times`)}${kvRow("First", e.first.slice(0, 16).replace("T", " "))}${kvRow("Last", e.last.slice(0, 16).replace("T", " "))}${e.keys?.length ? kvRow("Sessions", e.keys.map((k, i) => html`${i ? " " : ""}<a class="mono" href="#sessions/stopped/${k}">${k}</a>`)) : ""}
      ${e.log ? kvRow("Log", html`<span class="mono">${e.log}</span>`) : ""}${e.resolved ? kvRow("Resolved", `${e.resolved.at.slice(0, 10)}${e.resolved.note ? `: ${e.resolved.note}` : ""}`) : ""}</div>
      <div><h4>Message</h4><div class="mono" style="overflow-wrap:anywhere">${e.message}</div></div>
      <div><h4>Mark it fixed</h4><div class="mono" style="overflow-wrap:anywhere">fxa-sandbox-ctl errors resolve ${e.sig} "&lt;commit or note&gt;"</div></div>`); }
  else if (VIEW === "runners" && SEL.runners) { let d = null; try { d = sbDetails(SEL.runners); } catch (e) { d = String(emptybox(html`This panel did not render: ${e.message}`)); }
    if (d == null) sbClearGone(); else body = d; }
  else if (VIEW === "teams") { renderTeams(); return; }
  const out = body || String(emptybox("Select an item in the list to see its details."));
  // The Pipeline rail is written only when it changes, so a refresh keeps the keyboard focus a person put in it.
  if (VIEW === "pipeline" && el.dataset.h === out) return;
  el.dataset.h = out;
  rtFocus(() => { el.innerHTML = out; });
  document.body.classList.toggle("noitem", !body && ["sessions", "runners"].includes(VIEW));
}

// ── panels, keys, theme ──
function toggle(which) {
  const narrow = matchMedia(which === "side" ? "(max-width:900px)" : "(max-width:1280px)").matches;
  document.body.classList.toggle((narrow ? "show" : "no") + which);
  if (!narrow) try { localStorage.setItem("no" + which, document.body.classList.contains("no" + which) ? "1" : "0"); } catch {}
  renderHeader();
}
function select(id) {
  if (VIEW === "sessions") { location.hash = `sessions/${SESS_TAB}/${id}`; }
  else if (VIEW === "teams") {
    location.hash = id === "__all" ? "teams" : `teams/${id}`;
    if (matchMedia("(max-width:900px)").matches) { document.body.classList.add("tlist-closed"); renderHeader(); }
    return;
  }
  else {
    SEL[VIEW] = id; renderSide(); renderRight();
    if (VIEW === "teams") renderTeams();
    if (VIEW === "errors") document.getElementById("err-" + id)?.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  if (matchMedia("(max-width:900px)").matches) document.body.classList.remove("showside");
  if (matchMedia("(max-width:1280px)").matches) document.body.classList.add("showright");
  renderHeader();
}
function openHelp(on) {
  const h = document.getElementById("help"); if (on === h.classList.contains("on")) return;
  h.classList.toggle("on", on); document.getElementById("keys-on").checked = KEYS;
  if (on) { openHelp.back = document.activeElement; document.getElementById("help-close").focus(); } else openHelp.back?.focus?.();
}
document.addEventListener("click", e => {
  const it = e.target.closest?.(".si, [data-team]"); if (it) { select(it.dataset.id ?? it.dataset.team); return; }
  if (e.target.closest?.("#tside")) toggle("side");
  if (e.target.closest?.("#tlist")) { document.body.classList.toggle("tlist-closed"); renderHeader(); }
  if (e.target.closest?.("#tright")) toggle("right");
  if (e.target.closest?.("#rclose")) { document.body.classList.remove("showright"); renderHeader(); }
  if (e.target.closest?.("#helpbtn")) openHelp(true);
  if (e.target.closest?.("#help-close") || e.target.id === "help") openHelp(false);
  if (e.target.closest?.("#theme")) cycleTheme();
});
document.addEventListener("click", e => { if (e.target.closest?.("[data-steam-clear]")) { STEAM = ""; renderSide(); } });
document.addEventListener("change", e => { if (e.target.id === "sowner") { SOWNER = e.target.value; try { localStorage.setItem("sowner", SOWNER); } catch {} renderSide(); } });
document.addEventListener("change", e => { if (e.target.id === "keys-on") { KEYS = e.target.checked; try { localStorage.setItem("keys", KEYS ? "1" : "0"); } catch {} renderSide(); } });
document.addEventListener("input", e => { if (e.target.id === "q") { Q = e.target.value; CUR = -1; renderSide(); if (VIEW === "teams") renderTeams(); } });
document.addEventListener("keydown", e => {
  const help = document.getElementById("help");
  if (e.key === "Escape" && VIEW === "pipeline" && TAB === "belts" && SEL.pipeline) { location.replace("#pipeline/belts"); return; }
  if (e.key === "Escape") { openHelp(false); document.body.classList.remove("showside", "showright"); if (e.target.id === "q") e.target.blur(); renderHeader(); return; }
  if (help.classList.contains("on")) { if (e.key === "Tab") { e.preventDefault(); document.getElementById(document.activeElement.id === "help-close" ? "keys-on" : "help-close").focus(); } return; }
  if (!KEYS || e.metaKey || e.ctrlKey || e.altKey || e.target.matches?.("input, select, textarea")) return;
  const items = [...document.querySelectorAll(".si")];
  if (/^[1-9]$/.test(e.key) && VIEWS[e.key - 1]) location.hash = VIEWS[e.key - 1][0];
  else if (e.key === "/") { e.preventDefault(); if (matchMedia("(max-width:900px)").matches) document.body.classList.add("showside"); document.getElementById("q")?.focus(); }
  else if (e.key === "j" || e.key === "k") { if (!items.length) return; CUR = Math.max(0, Math.min(items.length - 1, CUR + (e.key === "j" ? 1 : -1))); items.forEach((x, i) => x.classList.toggle("cur", i === CUR)); items[CUR].focus(); }
  else if (e.key === "h" || e.key === "l") { const t = VIEWS.find(v => v[0] === VIEW)[3], i = t.findIndex(x => x[0] === TAB); if (t.length) location.hash = `${VIEW}/${t[(i + (e.key === "l" ? 1 : t.length - 1)) % t.length][0]}`; }
  else if (e.key === "[") toggle("side"); else if (e.key === "]") toggle("right");
  else if (e.key === "r") document.getElementById("refresh").click();
  else if (e.key === "?") openHelp(true);
});
function paintTheme() {
  const t = document.documentElement.dataset.theme;
  document.getElementById("themelbl").textContent = t ? t[0].toUpperCase() + t.slice(1) : "System";
}
function cycleTheme() {
  const r = document.documentElement, t = r.dataset.theme;
  if (!t) r.dataset.theme = "light"; else if (t === "light") r.dataset.theme = "dark"; else delete r.dataset.theme;
  try { r.dataset.theme ? localStorage.setItem("theme", r.dataset.theme) : localStorage.removeItem("theme"); } catch {}
  paintTheme();
}
paintTheme();

// Sandboxes, Recently completed: the last ended pipeline and Slack runs from /api/runs/recent?ended=1, which keeps the
// server's gates (a secured ticket, a private team, a routine's prompt); the tab filters them; a failed read keeps the last runs.
let SB_DONE = null, SB_DONE_SEQ = 0;
async function loadSbDone() {
  if (VIEW !== "runners") return;
  // The tab's source goes to the server, which filters before its limit of 100.
  const seq = ++SB_DONE_SEQ, src = sbDoneSrc();
  try {
    const r = await fetch(`/api/runs/recent?ended=1&limit=100${src ? `&src=${src}` : ""}`, { cache: "no-store" }), j = r.ok ? await r.json().catch(() => null) : null;
    if (!j || !Array.isArray(j.runs)) throw new Error(r.ok ? "the answer has no runs" : `HTTP ${r.status}`);
    if (j.error) throw new Error(j.error);
    if (seq !== SB_DONE_SEQ) return;
    SB_DONE = { runs: j.runs, err: null, at: Date.now(), src };
  } catch (e) { if (seq !== SB_DONE_SEQ) return; const same = SB_DONE?.src === src; SB_DONE = { runs: same ? SB_DONE.runs : null, err: e.message, at: same ? SB_DONE.at : null, src }; }
  safeRender(renderSbDone, "sb-done");
}
// The server filters by the tab's source, so runs held for another tab never stand in for this one.
const sbDoneSrc = () => ({ pipeline: "pipeline", slack: "slack", routines: "routine" }[TAB] ?? "");
function sbDoneRows() {
  return (SB_DONE?.runs ?? []).filter(r => typeof sbTabHas === "function" ? sbTabHas({ ...r, src: r.routine ? "routine" : r.src }) : true).slice(0, 20);
}
function renderSbDone() {
  const h = html`<h2>Recently completed</h2>`;
  if (TAB === "routines" && !TEAM_ADMIN?.admin) return putOv("sb-done", String(html`${h}${emptybox("Only a team admin can see routine runs.")}`));
  if (!SB_DONE || SB_DONE.src !== sbDoneSrc()) return putOv("sb-done", String(html`${h}${emptybox("Loading the recent runs…")}`));
  if (!SB_DONE.runs) return putOv("sb-done", String(html`${h}${emptybox(`Recently completed unknown: ${SB_DONE.err}. The next poll tries again.`)}`));
  const rows = sbDoneRows(), today = new Date().toDateString(), na = html`<span title="not recorded for pipeline runs">—</span>`;
  const note = SB_DONE.err ? `Recently completed may be out of date: ${SB_DONE.err}. These rows are from ${ago(Math.round((Date.now() - SB_DONE.at) / 1000))}; the next poll tries again.` : "";
  const row = r => {
    const d = new Date(r.end * 1000), when = !(r.end > 0) ? "—" : d.toDateString() === today ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    const pipe = r.src === "pipeline", href = pipe ? jiraHref(r.key) : sessHref(r.key);
    const key = !r.key ? "" : href ? html`<a class="key" href="${href}"${pipe ? html` target="_blank" rel="noreferrer"` : ""}>${r.key}</a> ` : html`<span class="key">${r.key}</span> `;
    // The server sends a non-admin only that a routine or a dependency fix ran.
    const gated = r.routine && !r.key ? (r.src === "depfix" ? "Dependency fix" : "Routine · scheduled run") : "";
    const who = gated || html`${key}${plainMd(r.title || "")}`;
    const where = pipe ? "GCE" : { firecracker: "Firecracker", gce: "GCE" }[r.where] ?? "—";
    const mem = Number.isFinite(r.mem_mb) ? `${(r.mem_mb / 1024).toFixed(1)} GB` : "—";
    const res = html`${raw(runBadge(r))}${r.stop && r.outcome !== "pr" ? html` <span class="sbd-stop">${r.stop}</span>` : ""}`;
    // A gated routine run comes with no team and no cost: a dash, not FxA and $0.00.
    const full = gated || `${r.key ? `${r.key} ` : ""}${plainMd(r.title || "")}`;
    return html`<tr data-sbdone="${r.key}"><td>${when}</td><td>${pipe ? "pipeline" : r.routine ? "routine" : "Slack"}</td><td class="sbd-for" title="${full}">${who}</td><td>${r.team ? teamLabel(r.team) : "—"}</td><td>${where}</td>
      <td class="num">${pipe ? na : Number.isFinite(r.boot_s) ? `${Math.round(r.boot_s)} s` : "—"}</td><td class="num">${pipe ? na : mem}</td><td class="num">${r.min != null ? `${Number(r.min)} min` : "—"}</td><td class="num">${r.usd == null ? "—" : usd(r.usd)}</td><td>${res}</td></tr>`;
  };
  const cols = ["Ended", "Source", "For", "Team", "Where", "Boot", "Peak memory", "Time", "LLM cost", "Result"];
  putOv("sb-done", String(html`${h}${note ? html`<div class="ovknote">${note}</div>` : ""}${rows.length ? html`<div class="sbd-scroll">${table(cols, rows.map(row))}</div>` : emptybox("No run has ended yet.")}
    <div class="sbd-more"><a href="#sessions">All sessions ›</a><a href="#stats">Stats ›</a></div>`), rows.map(r => `${r.key}:${r.end}:${r.outcome}`).join(",") + note);
}

// One section that throws (a snapshot shape no check has) says so in place; the rest of the page still renders.
function safeRender(fn, id) {
  try { fn(); } catch (e) { console.error(e); if (id) put(id, `<div class="emptybox">This section did not render: ${esc(e?.message ?? String(e))}. Reload, or run vm.sh rollback.</div>`); }
}
// The Overview cards draw only on the Overview: on another view they were about half of each poll's render time.
// renderTailKeys and renderLanes still run everywhere, since they set the tail keys.
// A function, so each call takes the current binding (a page check swaps one in).
const ovRenders = () => [[renderOvHead, "ov-head"], [renderOvNeeds, "ov-needs"], [renderOvMain, "ov-main"], [renderOvBudget, "ov-budget"], [renderOvRuns, "ov-runs"],
  [renderOvLlm, "ov-llm"], [renderOvHours, "ov-hours"], [renderOvTeams, "ov-teams"]];
function render() {
  [[renderStatus], [renderAlerts, "attn"], [renderTailKeys], [renderTickets, "s-queue"],
   [renderLanes, "s-lanes"], [renderDone, "s-done"], ...(VIEW === "overview" ? ovRenders() : []), [renderSess, "s-sess"], [renderSb],
   [renderNav], [renderTab], [renderHeader]].forEach(([f, id]) => safeRender(f, id));
  if (document.activeElement?.id !== "q" && !document.activeElement?.closest?.(".si")) safeRender(renderSide);
  safeRender(renderRight);
}

async function poll() {
  loadOverview();
  let data;
  try { data = await (await fetch("/api/snapshot", { cache:"no-store" })).json(); }
  catch { document.getElementById("dot").className = "dot dead"; document.getElementById("age").textContent = "server unreachable"; return; }
  SNAP = data.snapshot; AGENTS = data.agents; STATE = data;
  overlay();
  render();
  HIST_OPEN.forEach(loadHist);
  loadErrors(); loadStats(); loadTeams(); loadTeamAdmin(); loadRuns();
  loadSbDone();
  if (VIEW === "teams" && TTAB === "memory" && MEM.team && MEM.team === SEL.teams && TEAM_ADMIN?.admin) loadMemory(MEM.team).then(() => MEM.team === SEL.teams && renderTeams());
  if (VIEW === "teams" && TTAB === "routines" && RT.team && RT.team === SEL.teams && TEAM_ADMIN?.admin) loadRoutines(RT.team).then(() => RT.team === SEL.teams && rtPaint());
  // First load: fetch the agent output now, not on the next 5 s tick.
  if (!poll.tailed && TAIL_KEYS.length) { poll.tailed = true; pollTails(TAIL_KEYS); }
}
// A rebuild takes 15-25 s: poll every 2 s while it runs (at most 30 s), so its result shows when it lands. After
// Refresh, and at load, when the first request woke feeds that slept while nobody looked.
async function pollFresh(wait) {
  for (let i = 0; i < 15; i++) { await new Promise(r => setTimeout(r, i ? 2000 : wait)); await poll(); if (!STATE?.refreshing) break; }
}
document.getElementById("refresh").addEventListener("click", async () => {
  try { await fetch("/api/refresh", { method: "POST" }); } catch {}
  pollFresh(1500);
});
// Sessions as they change: every 3 s, the server answers from the store with only the
// sessions written since the last cursor. The 30 s feed still brings the live agents;
// a row stays from here while it is newer than the feed's (last_activity moves on every write).
let SESS_CUR = null;
const FRESH = new Map();
function overlay() {
  if (!AGENTS) return false;
  let changed = false;
  for (const [k, r] of FRESH) {
    const list = AGENTS.sessions ?? (AGENTS.sessions = []), s = list.find(x => x.key === k);
    if (r.deleted) { if (s) { AGENTS.sessions = list.filter(x => x.key !== k); changed = true; } FRESH.delete(k); continue; }
    if (s && (s.last_activity ?? 0) >= (r.last_activity ?? 0)) { FRESH.delete(k); continue; } // the feed caught up
    const row = { ...r, agent: s?.agent ?? null, agent_alive: s?.agent_alive ?? false };
    if (s) Object.assign(s, row); else list.unshift(row);
    changed = true;
  }
  if (changed) AGENTS.sessions.sort((a, b) => (b.created ?? 0) - (a.created ?? 0));
  return changed;
}
async function pollSessions() {
  let r;
  try { r = await (await fetch(`/api/sessions${SESS_CUR == null ? "" : `?since=${SESS_CUR}`}`, { cache: "no-store" })).json(); } catch { return; }
  if (r.cursor == null) return;
  SESS_CUR = r.cursor;
  (r.rows ?? []).forEach(x => FRESH.set(x.key, x));
  if (overlay()) render();
}
route();
pollFresh(0);
pollSessions();
// A hidden tab polls nothing (only tails checked before); it catches up when it shows again.
setInterval(() => document.hidden || poll(), 15000);
setInterval(() => document.hidden || pollSessions(), 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll(); pollSessions(); } });
setInterval(() => pollTails(TAIL_KEYS), 5000);
</script>
