<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FxA Agent</title>
<link rel="icon" id="favicon" href="/icon.png">
<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  /* FxA design tokens (libs/shared/assets tailwind.config.js), as fxa-settings applies them. */
  :root {
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px;
    --r-sm:4px; --r-lg:12px;
    --t-label:12px; --t-sub:13px; --t-body:14px; --t-head:18px; --t-huge:32px;

    --bg:#FAFAFB; --panel:#fff; --sunk:#F0F0F4; --line:#E7E7E7; --line2:#C2C2C2; --hover:#E7E7E7;
    --ink:#0C0C0D; --dim:#5E5E72; --faint:#6D6D6E;
    --ok:#00736C; --warn:#CC3D00; --bad:#C50042; --info:#0060DF; --purple:#7542E5; --link:#0060DF; --link-hover:#0250BB;
    --okbg:#E3FFF3; --warnbg:#FFF4DE; --badbg:#FFDFE7; --infobg:#E6EFFC;
    --amber:#FF7139; --lit:#E25920;
    --card-border:transparent; --shadow:0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
    /* FxA dropped Metropolis and Inter in 2024 (FXA-9058): the system stack, for body and headings */
    --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",sans-serif;
    --head:var(--sans);
    --purpletxt:#592ACB; --purplebg:#E7DFFF; --on-strong:#fff;   /* purple-700 on purple-50; text on a solid badge */
    --rail:72px; --side:300px; --right:340px;
    --mono:Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  }
  :root { color-scheme:light dark; }
  :root[data-theme="light"] { color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0C0C0D; --panel:#15141A; --sunk:#1F1E25; --line:#32313C; --line2:#5E5E72; --hover:#32313C;
      --ink:#FAFAFB; --dim:#C2C2C2; --faint:#9E9E9E;
      --ok:#3FE1B0; --warn:#FFBD4F; --bad:#FF848B; --info:#00B3F4; --purple:#AB71FF; --link:#0090ED; --link-hover:#00B3F4;
      --okbg:#0E2A24; --warnbg:#2E2210; --badbg:#35141D; --infobg:#0B2340;
      --amber:#FF8A50; --lit:#FFA266;
      --card-border:#32313C; --shadow:none; --purpletxt:#AB71FF; --purplebg:#321C64; --on-strong:#0C0C0D;
    }
  }
  :root[data-theme="dark"] {
    color-scheme:dark;
    --bg:#0C0C0D; --panel:#15141A; --sunk:#1F1E25; --line:#32313C; --line2:#5E5E72; --hover:#32313C;
    --ink:#FAFAFB; --dim:#C2C2C2; --faint:#9E9E9E;
    --ok:#3FE1B0; --warn:#FFBD4F; --bad:#FF848B; --info:#00B3F4; --purple:#AB71FF; --link:#0090ED; --link-hover:#00B3F4;
    --okbg:#0E2A24; --warnbg:#2E2210; --badbg:#35141D; --infobg:#0B2340;
    --amber:#FF8A50; --lit:#FFA266;
    --card-border:#32313C; --shadow:none; --purpletxt:#AB71FF; --purplebg:#321C64; --on-strong:#0C0C0D;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; overflow:hidden;
         background:var(--bg); color:var(--ink);
         font:var(--t-body)/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; border-radius:2px; }
  a:hover { text-decoration:underline; text-underline-offset:2px; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--link); outline-offset:2px; }
  .stats a, .alert .what a { color:var(--link); text-decoration:underline; text-underline-offset:2px; }
  .stats a:hover { color:var(--link-hover); }
  .stats a b { color:inherit; }
  [hidden] { display:none !important; }


  .warnt { color:var(--warn); font-weight:600; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none; }
  .dot.warn { background:var(--warn); } .dot.dead { background:var(--bad); }
  #health { font-weight:650; color:var(--ok); } #health.warn { color:var(--warn); } #health.dead { color:var(--bad); } #health.paused { color:var(--dim); }
  .dot.paused { background:var(--faint); }
  /* cta-neutral */
  button { font:600 var(--t-sub) var(--head); color:var(--ink); background:var(--bg);
           border:1px solid var(--line2); border-radius:var(--r-sm); padding:6px var(--s4); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--hover); }
  button:active { color:var(--faint); }

  /* ── alerts ── */
  #attn { display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s3); }
  #attn:empty { display:none; }
  .alert { display:flex; align-items:baseline; gap:var(--s3); padding:var(--s2) var(--s3);
           border-radius:var(--r-lg); border:1px solid; font-size:var(--t-sub); }
  .alert.bad  { color:var(--bad);  background:var(--badbg);  border-color:color-mix(in srgb,var(--bad) 25%,transparent); }
  .alert.warn { color:var(--warn); background:var(--warnbg); border-color:color-mix(in srgb,var(--warn) 25%,transparent); }
  .alert .what { color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .alert .fix { margin-left:auto; font-family:var(--mono); font-size:var(--t-label); padding:1px var(--s2);
                border-radius:var(--r-sm); background:var(--panel); border:1px solid currentColor; white-space:nowrap; }

  /* ── panels ── */
  .grid { display:grid; gap:var(--s3); grid-template-columns:1fr; align-items:start; }
  @media (min-width:900px) { .grid { grid-template-columns:minmax(0,1fr) minmax(0,1fr); } }
  section { border:1px solid var(--card-border); box-shadow:var(--shadow); border-radius:var(--r-lg); background:var(--panel); padding:var(--s4) var(--s6); min-width:0; }
  section.wide { grid-column:1/-1; }
  h2 { font:700 16px/1.3 var(--head); margin:0 0 var(--s3); color:var(--ink);
       display:flex; align-items:baseline; gap:var(--s2); }
  h2 .n { font-size:var(--t-body); font-weight:700; color:var(--dim); font-variant-numeric:tabular-nums; }
  h2 .note { margin-left:auto; font:400 var(--t-sub) var(--sans); color:var(--faint); text-transform:none; }
  h2 .sub  { font:400 var(--t-sub) var(--sans); color:var(--faint); text-transform:none; }
  .empty { color:var(--faint); font-size:var(--t-sub); }
  .unknown { color:var(--warn); font-size:var(--t-sub); font-weight:600; }
  .headline { display:flex; align-items:baseline; gap:var(--s3); margin:0 0 var(--s3); }
  .headline .big { font-family:var(--head); font-size:var(--t-huge); font-weight:700; line-height:1; letter-spacing:-.025em; font-variant-numeric:tabular-nums; }
  .headline .cap { color:var(--ink); }
  .headline .rest { color:var(--faint); font-size:var(--t-sub); margin-left:auto; }

  .item { padding:var(--s2) 0; }
  .item + .item { border-top:1px solid color-mix(in srgb,var(--line) 60%,var(--panel)); }
  .item:last-child { padding-bottom:0; }
  .line1 { display:grid; grid-template-columns:82px minmax(0,1fr) 152px; align-items:baseline; gap:var(--s3); }
  .line1 > :last-child { justify-self:start; }
  .line2 { color:var(--dim); font-size:var(--t-sub); margin-top:2px; display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap; }
  .key { font-family:var(--mono); font-size:var(--t-sub); font-weight:600; color:var(--info); white-space:nowrap; }
  .title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .mono { font-family:var(--mono); font-size:var(--t-label); }

  .tag { font-size:var(--t-label); font-weight:600; padding:2px var(--s2); border-radius:999px;
         border:1px solid transparent; color:var(--dim); background:var(--sunk); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .tag.ok { color:var(--ok); background:var(--okbg); } .tag.bad { color:var(--bad); background:var(--badbg); }
  .tag.warn { color:var(--warn); background:var(--warnbg); } .tag.info { color:var(--info); background:var(--infobg); }
  .tag.merged { color:var(--purpletxt); background:var(--purplebg); }
  .tag.run::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:currentColor;
                     margin-right:5px; vertical-align:1px; }
  .age { font-variant-numeric:tabular-nums; } .age.old { color:var(--bad); font-weight:650; }

  .checks { display:inline-flex; gap:2px; align-items:center; vertical-align:-2px; }
  .checks i { width:3px; height:11px; border-radius:1px; background:var(--ok); }
  .checks i.f { background:var(--bad); height:16px; } .checks i.r { background:var(--info); }

  details { margin-top:var(--s3); }
  details summary { cursor:pointer; color:var(--dim); font-size:var(--t-sub); list-style:none; }
  details summary::-webkit-details-marker { display:none; }
  details summary::before { content:"\25B8  "; color:var(--faint); }
  details[open] summary::before { content:"\25BE  "; }
  details .body { margin-top:var(--s2); padding-left:var(--s3); border-left:2px solid var(--line); }
  details .reason { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }

  /* ── agent cards ── */
  #s-agents.running { background:linear-gradient(180deg,#241f18,#1a1713); border-color:#4a4034; color:#ece7de; }
  #s-agents.running h2 { color:#b9b0a0; } #s-agents.running h2 .n { color:var(--amber); }
  #s-agents.running .title { color:#f2ede4; } #s-agents.running .stats { color:#b0a798; }
  #s-agents.running .term-body { background:#15120e; color:#c9c0b0; } #s-agents.running summary { color:#b0a798; }
  #s-agents.running .rail-lbl { color:#9b9284; }
  .fac { padding:var(--s3) 0; } .fac + .fac { border-top:1px solid var(--line); }
  .fac .top { display:grid; grid-template-columns:88px minmax(0,1fr) max-content; gap:var(--s3); align-items:baseline; }
  .fac .top .key { color:var(--info); } #s-agents.running .fac .top .key { color:var(--lit); } .fac .top .title { font-weight:500; }
  .fac .top .tags { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; }
  .rail { display:flex; align-items:center; margin:var(--s3) 0 var(--s2); max-width:600px; }
  .rail .node { display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; }
  .rail .box { width:15px; height:15px; border-radius:3px; background:var(--sunk); border:1px solid var(--line2); display:grid; place-items:center; }
  .rail .box i { width:5px; height:5px; border-radius:1px; background:var(--line2); }
  .rail .node.done .box { border-color:color-mix(in srgb,var(--ok) 55%,var(--line2)); } .rail .node.done .box i { background:var(--ok); }
  .rail .node.now .box { border-color:var(--amber); box-shadow:0 0 0 2px color-mix(in srgb,var(--amber) 22%,transparent); }
  .rail .node.now .box i { background:var(--amber); animation:forge 1.6s ease-in-out infinite; }
  @keyframes forge { 0%,100%{opacity:1} 50%{opacity:.35} }
  .rail .node.fail .box { border-color:var(--bad); } .rail .node.fail .box i { background:var(--bad); }
  .rail-lbl { font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); white-space:nowrap; }
  .rail .node.now .rail-lbl { color:var(--amber); font-weight:700; } .rail .node.done .rail-lbl { color:var(--dim); }
  .rail .seg { flex:1; height:4px; min-width:14px; margin:0 3px 13px; border-radius:2px; background:var(--sunk);
               border:1px solid var(--line); overflow:hidden; position:relative; }
  .rail .seg::before { content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--line2) 70%,transparent) 0 4px,transparent 4px 10px); background-size:10px 100%; }
  .rail .seg.done::before { background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--ok) 55%,transparent) 0 4px,transparent 4px 10px); background-size:10px 100%; }
  .rail .seg.moving::before { animation:belt 800ms linear infinite; } @keyframes belt { to { background-position:10px 0; } }
  .rail .seg.jammed::before { background:repeating-linear-gradient(115deg,color-mix(in srgb,var(--bad) 45%,transparent) 0 5px,transparent 5px 10px); }
  .stats { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; font-size:var(--t-sub); color:var(--dim); }
  .stats b { color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums; }
  #s-agents.running .stats b { color:var(--lit); }
  .stats .add { color:var(--ok); } .stats .del { color:var(--bad); }
  .stats .sep { width:1px; height:11px; background:var(--line2); opacity:.6; }
  .stats .last { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:72ch; display:inline-block; vertical-align:bottom; }
  .fac details { margin-top:var(--s2); }
  .fac details.hist summary { font:500 var(--t-sub) var(--sans); color:var(--dim); }
  .fac summary { font-family:var(--mono); font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .term-body { margin-top:var(--s2); background:var(--sunk); color:var(--dim); border:1px solid var(--line); border-radius:var(--r-sm);
               padding:var(--s2); max-height:clamp(96px,20vh,170px); overflow:auto; overscroll-behavior:contain;
               font-family:var(--mono); font-size:11px; line-height:1.45; white-space:pre; }
  .chat { max-height:55vh; overflow:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:var(--s2); }
  .msg { border:1px solid var(--line); border-radius:var(--r-sm); padding:var(--s2) var(--s3); background:var(--sunk);
         font-size:var(--t-sub); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { background:var(--infobg); border-color:color-mix(in srgb,var(--info) 25%,transparent); margin-right:15%; }
  .msg.agent { margin-left:15%; }
  .msg.action { background:transparent; border-style:dashed; color:var(--dim); text-align:center; }
  .msg .who { display:block; font-size:var(--t-label); font-weight:650; color:var(--dim); margin-bottom:2px; white-space:normal; }
  .msg .who span { font-weight:400; color:var(--faint); margin-left:var(--s2); }
  .waiting { display:grid; grid-template-columns:88px minmax(0,1fr) max-content; gap:var(--s3); align-items:baseline;
             padding:var(--s2) 0; font-size:var(--t-sub); border-top:1px solid var(--line); }

  /* ── pool and runners ── */
  .slot { display:grid; grid-template-columns:96px minmax(60px,1fr) max-content; align-items:center; gap:var(--s3); padding:var(--s2) 0; }
  .slot + .slot { border-top:1px solid color-mix(in srgb,var(--line) 60%,var(--panel)); }
  .slot .nm { font-family:var(--mono); font-size:var(--t-sub); }
  .slot .meter { height:6px; border-radius:3px; background:var(--sunk); overflow:hidden; }
  .slot .meter i { display:block; height:100%; width:0; border-radius:3px; }
  .slot.free .meter { background:transparent; border:1px dashed var(--line2); }
  .slot.virtual .meter { background:transparent; border:1px dotted var(--line); }
  .slot.virtual .nm { color:var(--faint); }
  .slot.busy .meter i { width:100%; background:var(--info); opacity:.7; }
  .slot.held .meter i { width:100%; background:var(--warn); opacity:.45; }
  .slot.over .meter i { width:100%; background:var(--bad); opacity:.6; }
  .slot .r { display:flex; gap:5px; align-items:center; }
  .slot .meter.none { visibility:hidden; }
  .freeslots { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:var(--s2) 0; font-size:var(--t-sub); color:var(--dim); }
  .freeslots + .slot, .slot + .freeslots { border-top:1px solid color-mix(in srgb,var(--line) 60%,var(--panel)); }

  /* ── shell: left rail, list, main, details, status bar ── */
  .shell { height:100vh; display:grid; grid-template-rows:minmax(0,1fr) 32px;
           grid-template-columns:var(--rail) var(--side) minmax(0,1fr) var(--right);
           grid-template-areas:"rail side main right" "status status status status"; }
  body.noside .shell, body.v-overview .shell, body.v-pipeline .shell, body.bare .shell { --side:0px; }
  body.noright .shell, body.v-overview .shell, body.v-pipeline .shell, body.v-stats .shell, body.v-teams .shell, body.bare .shell, body.noitem .shell { --right:0px; }
  body.noside .side, body.v-overview .side, body.v-pipeline .side, body.bare .side,
  body.noright .right, body.v-overview .right, body.v-pipeline .right, body.v-stats .right, body.v-teams .right, body.bare .right, body.noitem .right { visibility:hidden; }
  .rail { grid-area:rail; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding:var(--s3) 0; gap:2px; z-index:11; }
  .rail .logo { width:40px; height:40px; margin-bottom:var(--s3); }
  .rail a, .rail button.rb { position:relative; width:60px; min-height:52px; padding:8px 0 6px; border-radius:var(--r-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
           color:var(--dim); font:600 var(--t-label)/1 var(--sans); background:none; border:0; }
  .rail a:hover, .rail button.rb:hover { text-decoration:none; background:var(--hover); color:var(--ink); }
  .rail a[aria-current] { color:var(--link); background:var(--sunk); font-weight:700; }   /* fxa-settings .nav-active */
  .rail svg { width:20px; height:20px; }
  .rail .n { position:absolute; top:2px; right:6px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; font:700 var(--t-label)/18px var(--sans); text-align:center; background:var(--sunk); color:var(--dim); }
  .rail .n:empty { display:none; }
  .rail .n.bad { background:var(--bad); color:var(--on-strong); } .rail .n.info { background:var(--info); color:var(--on-strong); } .rail .n.warn { background:var(--warn); color:var(--on-strong); }
  .rail .grow { flex:1; }
  .side { grid-area:side; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .side .sh { padding:var(--s4) var(--s4) var(--s2); }
  .side .sh h2 { margin:0; font-size:var(--t-body); }
  .search { margin-top:var(--s3); display:flex; align-items:center; gap:6px; border:1px solid var(--line2); border-radius:8px; padding:0 10px; background:var(--panel); color:var(--dim); }
  .search:focus-within { border-color:var(--link); }
  .search input { flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font:inherit; padding:8px 0; outline:none; }
  kbd { font:600 var(--t-label) var(--mono); color:var(--dim); border:1px solid var(--line2); border-radius:3px; padding:0 4px; }
  .slist2 { overflow:auto; padding:0 var(--s2) var(--s3); flex:1; }
  .slist2 ul { list-style:none; margin:0; padding:0; }
  .sgroup { font:700 var(--t-label) var(--sans); color:var(--dim); padding:var(--s3) var(--s2) 4px; margin:0; }
  .si { width:100%; text-align:left; display:grid; grid-template-columns:10px minmax(0,1fr); gap:2px var(--s2); align-items:baseline; padding:8px var(--s2);
        border:0; border-radius:8px; background:none; font:inherit; font-weight:400; color:inherit; cursor:pointer; }
  .si:hover { background:var(--hover); }
  .si[aria-current] { background:var(--infobg); box-shadow:inset 3px 0 0 var(--info); }
  .si[aria-current] .m { color:var(--dim); }
  .si.cur { outline:2px solid var(--link); outline-offset:-2px; }
  .si .d { width:8px; height:8px; border-radius:50%; background:var(--line2); align-self:center; }
  .si .d.live { background:var(--info); animation:pulse 2s infinite; }
  .si .d.bad, .si .d.fix { background:var(--bad); } .si .d.warn { background:var(--warn); } .si .d.ok { background:var(--ok); }
  @keyframes pulse { 50% { opacity:.4; } }
  .si .t { font-size:var(--t-body); font-weight:600; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.35; }
  .si .m { grid-column:2; font-size:var(--t-label); color:var(--faint); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .main { grid-area:main; overflow:auto; min-width:0; }
  .mh { position:sticky; top:0; z-index:5; background:var(--bg); padding:var(--s4) var(--s6) 0; }
  .mh .row { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
  .mh h1 { margin:0; font:700 22px/1.2 var(--sans); }
  .mh .vsub { color:var(--faint); }
  .mh .acts { margin-left:auto; display:flex; gap:6px; }
  .iconbtn { width:36px; height:36px; padding:0; display:grid; place-items:center; border-radius:8px; color:var(--dim); }
  .iconbtn svg { width:18px; height:18px; } .iconbtn.lbl { width:auto; display:flex; gap:6px; padding:0 12px; } .iconbtn[aria-pressed="true"] { color:var(--link); border-color:var(--link); }
  .mc { padding:var(--s4) var(--s6) var(--s6); }
  /* Drag handles on the sidebars' inner edges: drag to resize, double-click for the default. */

th d="M481 283Q470 272 446 268C445 311 431 331 392 347L328 374Q329 414 357 435C416 414 466 373 482 330Q492 299 481 283Z" fill="url(#fox-cheek)"/><path d="M481 283Q445 330 392 347Q355 359 328 374L334 395C400 375 445 337 481 300Z" fill="var(--fox-panel-light, #FFFFFF)" opacity=".6"/></g><g id="fox-eyes" fill="var(--fox-eye, #00DDFF)" stroke="var(--fox-eye, #00DDFF)"><g id="fox-eye-left"><ellipse cx="166" cy="289" rx="19" ry="38" stroke="none"/><ellipse cx="162" cy="268" rx="9" ry="10" fill="var(--fox-eye-highlight, #AAF2FF)" stroke="none"/></g><path id="fox-eye-right" d="M360 266L323 289L360 311" fill="none" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g><g id="fox-muzzle"><path d="M185 375Q194 355 216 355L296 355Q318 355 327 375L344 424Q315 473 256 477Q197 473 168 424Z" fill="url(#fox-shell)"/><path d="M200 366Q218 359 256 360Q294 359 312 366" fill="none" stroke="var(--fox-highlight, #0090ED)" stroke-width="6" stroke-linecap="round"/><path d="M227 370Q256 366 285 370Q298 371 291 384L272 408Q265 416 256 416Q247 416 240 408L221 384Q214 371 227 370Z" fill="url(#fox-nose)" stroke="var(--fox-ink, #15141A)" stroke-width="3"/><path d="M230 375Q256 372 282 375" fill="none" stroke="var(--fox-nose-light, #414753)" stroke-width="5" stroke-linecap="round"/><path d="M258 444Q285 444 304 420" fill="none" stroke="var(--fox-ink, #15141A)" stroke-width="9" stroke-linecap="round"/></g></svg></template>

<script>
"use strict";
// Links come from the snapshot's team block and fail closed: a bad site, repo, key or number gives plain text.
const REPO_RE = /^(?!.*\.\.)[\w-][\w.-]*\/[\w-][\w.-]*$/;
function teamRepo() { const r = SNAP?.team?.repo ?? SNAP?.repo ?? ""; return REPO_RE.test(r) ? r : ""; }
function jiraHref(k) { const s = String(SNAP?.team?.jira_site ?? "").replace(/\/+$/, ""); return /^https:\/\/[\w-]+(\.[\w-]+)+(:\d+)?$/.test(s) && /^[A-Z][A-Z0-9]+-\d+$/.test(k ?? "") ? `${s}/browse/${encodeURIComponent(k)}` : ""; }
function prUrl(n) { const r = teamRepo(); return r && /^\d+$/.test(String(n ?? "")) ? `https://github.com/${r}/pull/${n}` : ""; }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ago = s => s == null ? "never" : s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s/60)}m ago`
  : s < 172800 ? `${Math.round(s/3600)}h ago` : `${Math.round(s/86400)}d ago`;
const short = s => s == null ? "" : s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s/60)}m` : `${(s/3600).toFixed(1)}h`;
const stamp = e => e == null ? "" : new Date(e * 1000).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" });
const days = iso => iso == null ? null : (Date.now() - Date.parse(iso)) / 86400000;
const jira = k => jiraHref(k) ? `<a class="key" href="${jiraHref(k)}" target="_blank" rel="noreferrer">${esc(k)}</a>` : `<span class="key">${esc(k)}</span>`;
const prl = (_, n) => prUrl(n) ? `<a class="key" href="${prUrl(n)}" target="_blank" rel="noreferrer">#${esc(n)}</a>` : `<span class="key">#${esc(n)}</span>`;
const TICKET = /^[A-Z][A-Z0-9]+-\d+$/;
const usd = n => n == null ? "—" : "$" + Number(n).toFixed(2);

const LAST = {};
function put(id, html) {
  if (LAST[id] === html) return false;
  const node = document.getElementById(id);
  if (!node) return false;
  LAST[id] = html;
  const closed = new Set([...node.querySelectorAll("details")].filter(d => !d.open && d.dataset.k).map(d => d.dataset.k));
  node.innerHTML = html;
  node.querySelectorAll("details").forEach(d => { if (d.dataset.k && closed.has(d.dataset.k)) d.open = false; });
  return true;
}
const sentence = t => t.charAt(0).toUpperCase() + t.slice(1);
function head(title, n, note, sub) {
  return `<h2>${sentence(title)}${sub ? `<span class="sub">${sub}</span>` : ""}${n != null ? `<span class="n">${n}</span>` : ""}${note ? `<span class="note">${note}</span>` : ""}</h2>`;
}
const titled = t => `<span class="title" title="${esc(t ?? "")}">${esc(t ?? "")}</span>`;

function checkBars(r) {
  const total = (r.ok ?? 0) + (r.fail ?? 0) + (r.running ?? 0);
  if (total === 0) return "";
  const scale = total > 30 ? 30 / total : 1, w = n => n > 0 ? Math.max(1, Math.round(n * scale)) : 0;
  const label = `${r.ok} passed, ${r.fail} failed, ${r.running} running`;
  return `<span class="checks" role="img" aria-label="${esc(label)}" title="${esc(label)}">${
    "<i class='f'></i>".repeat(w(r.fail)) + "<i class='r'></i>".repeat(w(r.running)) + "<i></i>".repeat(w(r.ok))}</span>`;
}
const hasChecks = r => ((r.ok ?? 0) + (r.fail ?? 0) + (r.running ?? 0)) > 0;
function verdictTag(r) {
  if (r.pr == null)                     return `<span class="tag warn">no PR</span>`;
  if (r.state === "MERGED")             return `<span class="tag merged">merged</span>`;
  if (r.state === "CLOSED")             return `<span class="tag warn">closed</span>`;
  if (r.draft)                          return `<span class="tag">draft</span>`;
  if (r.review === "CHANGES_REQUESTED") return `<span class="tag bad">changes requested</span>`;
  if (r.fail > 0 && r.infra)            return `<span class="tag warn" title="${esc(r.infra)}">infra red</span>`;
  if (r.fail > 0)                       return `<span class="tag bad">${r.fail} failing</span>`;
  if (r.running > 0)                    return `<span class="tag run info">${r.running} running</span>`;
  if (!hasChecks(r))                    return `<span class="tag">no checks yet</span>`;
  if (r.mergeable === "CONFLICTING")    return `<span class="tag bad">conflicts</span>`;
  if (r.review === "APPROVED")          return `<span class="tag ok">approved</span>`;
  return `<span class="tag ok">green</span>`;
}
function waitAge(r) {
  const h = r.last_human_review;
  const since = h ? days(h.at) : days(r.created ?? r.updated);
  if (since == null) return "";
  const who = h ? `since ${esc(h.login)}'s review` : "no human review yet";
  const req = (r.reviewers ?? []).map(x => esc(x.replace(/^mozilla\//, ""))).join(", ");
  return `<span class="age${since >= 3 ? " old" : ""}">${Math.round(since)}d</span><span>${who}</span>${req ? `<span>· requested ${req}</span>` : ""}`;
}
const isWaitingOnHuman = r => r.pr && r.state === "OPEN" && !r.draft && r.fail === 0 && r.running === 0 &&
  hasChecks(r) && r.mergeable !== "CONFLICTING" && r.review !== "APPROVED" && r.review !== "CHANGES_REQUESTED";

// ── the agent's own output, on its own cadence ──
const TAILS = {}; let TAIL_KEYS = [];
function paintTail(key, isLive) {
  const lane = document.getElementById("lane-term-" + key);
  if (lane) {
    const body = lane.querySelector(".body"), lines = TAILS[key] || [], next = lines.join("\n");
    lane.querySelector(".state").textContent = lines.length ? "running" : "connecting…";
    lane.classList.toggle("busy", lines.length > 0);
    // A redraw replaces the panel; LANE_SCROLL keeps a reader's place above the newest line.
    if (body._text !== next) { body._text = next; body.innerHTML = lines.map(ttyLine).join("\n"); }
    body.scrollTop = LANE_SCROLL[key] ?? body.scrollHeight;
  }
  const el = document.getElementById("term-" + key); if (!el) return;
  const body = el.querySelector(".body"), hdr = el.querySelector(".hdr"), lines = TAILS[key] || [];
  const next = lines.join("\n");
  if (hdr) hdr.textContent = lines.length
    ? (isLive ? "agent output · live · " : "final output · ") + (lines[lines.length - 1] || "").trim().slice(0, 120)
    : (isLive ? "agent output · waiting…" : "no output captured");
  if (body.textContent === next) return;
  const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 24;
  body.textContent = next;
  if (atBottom) body.scrollTop = body.scrollHeight;
}
async function pollTails(keys) {
  if (document.hidden) return;
  for (const k of keys) {
    try {
      const r = await (await fetch(`/api/tail?key=${encodeURIComponent(k)}`, { cache:"no-store" })).json();
      if (r && Array.isArray(r.lines)) { TAILS[k] = r.lines; paintTail(k, true); paintTty(k, (AGENTS?.sessions ?? []).find(s => s.key === k)?.agent_alive); }
    } catch {}
  }
}

// ── the conveyor: boot sub-steps are real steps now ──
const BOOT = ["boot","checkout","hardening","config","launching"];
const STAGES = [["starting","boot"],["watching","agent"],["squashing","squash"],["pushed","push"],["pr","PR"],["ci","CI"]];
function rail(t) {
  const failed = t.stage === "error" || t.stage === "stalled";
  let i = STAGES.findIndex(x => x[0] === t.stage);
  if (t.stage === "stalled") i = 1;
  if (t.stage === "pr") i = t.pr ? 5 : 4;
  if (i < 0) i = 0;
  const ciDone = t.pr && t.fail === 0 && t.running === 0 && hasChecks(t);
  const live = t.live || (t.stage === "pr" && t.pr && t.running > 0);
  return `<div class="rail">${STAGES.map(([id, lbl], n) => {
    const cls = failed ? (n === i ? "fail" : n < i ? "done" : "") : n < i ? "done" : n === i ? (id === "ci" && ciDone ? "done" : "now") : "";
    const seg = ["seg"]; if (failed && n >= i) seg.push("jammed"); else if (n < i) seg.push("done"); if (live && n === i) seg.push("moving");
    const label = n === 0 && t.stage === "starting" && t.detail ? esc(t.detail) : lbl;
    return `<div class="node ${cls}"><span class="box"><i></i></span><span class="rail-lbl">${label}</span></div>${
      n < STAGES.length - 1 ? `<span class="${seg.join(" ")}"></span>` : ""}`;
  }).join("")}</div>`;
}

// One card per runner (fast feed) merged with its ticket row (slow feed).
function card(t) {
  const a = t.agent || {};
  const stalled = t.stage === "stalled", failed = t.stage === "error";
  const stat = t.diffstat || "", ins = stat.match(/(\d+) insertion/), del = stat.match(/(\d+) deletion/);
  const idle = a.idle_seconds ?? null;
  const status = t.ci ? (t.fail > 0 ? `<span class="tag bad">${t.fail} failing</span>`
      : t.running > 0 ? `<span class="tag run info">CI ${t.running} running</span>`
      : t.pr ? `<span class="tag ok">CI green</span>` : `<span class="tag info">PR opening</span>`)
    : stalled ? `<span class="tag bad">stalled · ${esc((t.detail || "").split(" ")[0])}</span>`
    : failed ? `<span class="tag bad">run failed</span>`
    : t.stage === "starting" ? `<span class="tag run info">${esc(t.detail || "boot")}</span>`
    : t.stage === "squashing" || t.stage === "pushed" ? `<span class="tag run info">${esc(t.stage)}</span>`
    : !t.agent_alive ? `<span class="tag bad">agent exited</span>`
    : idle != null && idle >= 300 ? `<span class="tag warn">idle ${short(idle)}</span>`
    : `<span class="tag run ok">working</span>`;
  const base = t.base_ok === true ? `<span class="tag ok" title="sandbox is on the slot's commit">base ok</span>`

  catch { USAGE[key] = { at: Date.now(), rows: USAGE[key]?.rows ?? [] }; }
  renderRight(); if (ANS_OPEN.has(key)) renderAnswers();
}
function sessionDetails(s) {
  const a = s.agent || {}, rt = s.runtime || "claude", now = Date.now() / 1000, live = LIVE_SESSION.includes(s.state);
  const model = rt === "claude" ? (a.model || AGENTS?.session_models?.claude) : AGENTS?.session_models?.codex;
  const cost = sessUsd(s), [st] = sessStatus(s);
  const ch = chainOf(s, AGENTS?.sessions ?? []), convUsd = ch.reduce((x, y) => x + (sessUsd(y) || 0), 0), convTurns = ch.reduce((x, y) => x + (Number(y.turns) || 0), 0);
  const one = ch.length > 1 ? ` <span class="na">· this session ${cost ? usd(cost) : "—"}</span>` : "";
  const pauseIn = s.state === "active" && !s.agent_alive && s.turn_open !== "1" && s.last_activity ? Math.max(0, Math.round(AGENTS.session_idle_seconds - (now - s.last_activity))) : null;
  const endsIn = live && s.booted_at ? Math.max(0, Math.round(AGENTS.session_max_run_seconds - (now - s.booted_at))) : null;
  const nr = "not recorded for this session", rs = num(s.runner_s), peak = (() => { try { return JSON.parse(s.res_peak || "null"); } catch { return null; } })();
  return `${closeBtn}
    <div><h4>Session</h4>${kvr("State", esc(st))}${kvr("Agent", `${rt === "codex" ? "Codex" : "Claude"}${model ? ` · <span class="mono">${esc(model)}</span>` : ""}`)}${kvr(ch.length > 1 ? `Cost, ${ch.length} sessions` : "Cost", (convUsd ? usd(convUsd) : "—") + one)}
      ${kvr("Turns", esc(convTurns) + (ch.length > 1 ? ` <span class="na">· this session ${esc(s.turns ?? 0)}</span>` : ""))}${s.routine_run ? kvr("Routine", sessRoutineLink(s)) : kvr("Owner", esc(ownerName(s) || "unknown"))}${kvr("Started", stamp(s.created))}${s.resume_from ? kvr("Resumed from", `<a href="#sessions/${SESS_TAB}/${esc(s.resume_from)}">${esc(s.resume_from)}</a>`) : ""}
      ${pauseIn != null ? kvr("Idle pause in", short(pauseIn)) : ""}${endsIn != null ? kvr("Sandbox ends in", short(endsIn)) : ""}</div>
    <div><h4>Usage by model</h4>${usageHtml(s.key)}</div>
    <div><h4>Runner</h4>${s.boot_s ? kvr("Boot", `${Math.round(num(s.boot_s))} s${s.boot_backend ? ` · ${esc(s.boot_backend)}` : ""}`) : ""}
      ${rs != null ? kvr("Busy, idle", `${short(num(s.busy_s))} busy · ${short(num(s.idle_s))} idle of ${short(rs)}`) : kvr("Busy, idle", live ? "recorded when it stops" : nr, 1)}
      ${s.verify_runs != null ? kvr("Verify runs", `${s.verify_runs} · ${s.verify_full ?? 0} full · ${short(num(s.verify_s))}${num(s.verify_fail_runs) ? ` · ${s.verify_fail_runs} with a FAIL` : ""}`) : kvr("Verify runs", nr, 1)}
      ${s.stack_starts != null ? kvr("Stack starts", `${s.stack_starts}${num(s.stack_starts) ? ` · ${short(num(s.stack_s))}` : ""}${num(s.stack_fails) ? ` · ${s.stack_fails} failed` : ""}`) : kvr("Stack starts", nr, 1)}
      ${peak ? kvr("Peak load, memory, disk", `${peak.load1} · ${(peak.mem_mb / 1024).toFixed(1)} GB · ${peak.disk_pct}%`) : ""}
      ${s.compute_usd ? kvr("Compute, estimated", usd(num(s.compute_usd))) : ""}${s.stop_reason && s.stop_reason !== s.state ? kvr("Stopped because", esc(s.stop_reason)) : ""}</div>`;
}
function renderRight() {
  const el = document.getElementById("right"); let html = "";
  if (["errors", "lessons", "runners"].includes(VIEW) && !SEL[VIEW]) SEL[VIEW] = sideGroups()[0]?.items[0]?.id;
  if (VIEW === "sessions") { const s = currentSession(); if (s) html = sessionDetails(s); }
  else if (VIEW === "errors") { const e = (ERRS ?? []).find(x => x.sig === SEL.errors);
    if (e) html = `${closeBtn}<h2 class="rh">Error<small>${esc(e.sig)}</small></h2><div><h4>Signature</h4>${kvr("Status", esc(e.status))}${kvr("Source", `${esc(e.source)}/${esc(e.kind)}`)}${kvr("Where", esc(e.where))}
      ${kvr("Seen", `${e.count} times`)}${kvr("First", esc(e.first.slice(0, 16).replace("T", " ")))}${kvr("Last", esc(e.last.slice(0, 16).replace("T", " ")))}${e.keys?.length ? kvr("Sessions", e.keys.map(k => `<a class="mono" href="#sessions/stopped/${esc(k)}">${esc(k)}</a>`).join(" ")) : ""}
      ${e.log ? kvr("Log", `<span class="mono">${esc(e.log)}</span>`) : ""}${e.resolved ? kvr("Resolved", `${esc(e.resolved.at.slice(0, 10))}${e.resolved.note ? `: ${esc(e.resolved.note)}` : ""}`) : ""}</div>
      <div><h4>Message</h4><div class="mono" style="overflow-wrap:anywhere">${esc(e.message)}</div></div>
      <div><h4>Mark it fixed</h4><div class="mono" style="overflow-wrap:anywhere">fxa-sandbox-ctl errors resolve ${esc(e.sig)} "&lt;commit or note&gt;"</div></div>`; }
  else if (VIEW === "lessons") { const l = (LESSONS ?? []).find(x => x.id === SEL.lessons);
    if (l) html = `${closeBtn}<h2 class="rh">Lesson<small>from ${esc(l.session)}</small></h2><div><h4>Text</h4>${esc(l.text)}</div>${l.why ? `<div><h4>Why</h4>${esc(l.why)}</div>` : ""}
      <div><h4>Record</h4>${kvr("Status", esc(l.status))}${kvr("Proposed", esc((l.at || "").slice(0, 10)))}${l.decided_at ? kvr("Decided", esc(l.decided_at.slice(0, 10))) : ""}${kvr("Session", `<a class="mono" href="#sessions/stopped/${esc(l.session)}">${esc(l.session)}</a>`)}</div>
      <p class="empty">Edit, approve or reject it in the list in the middle.</p>`; }
  else if (VIEW === "runners") { const id = SEL.runners ?? "", v = (AGENTS?.instances ?? []).find(x => x.name === id);
    if (v) { const s = (AGENTS?.sessions ?? []).find(x => x.key === v.name.replace(/^agent-/, ""));
      html = `${closeBtn}<h2 class="rh">${esc(v.name)}<small>${v.where === "firecracker" ? "Firecracker slot" : "GCE instance"}</small></h2><div><h4>Sandbox</h4>${kvr("State", esc(v.state))}${instUp(v) ? kvr("Up for", short(v.age_seconds)) + (v.max_seconds ? kvr("Lifetime cap", short(v.max_seconds)) : "") : kvr("Made", `${short(v.age_seconds)} ago`)}${v.zone ? kvr("Zone", esc(v.zone)) : ""}
        ${s ? kvr("Session", `<a class="mono" href="#sessions/${sessTabOf(s)}/${esc(s.key)}">${esc(s.key)}</a> · ${esc(s.state)}`) : instUp(v) ? kvr("Session", "pipeline run") : kvr("Session", "none")}</div>${instUp(v) ? "" : `<div><h4>Fix</h4><p>The instance is stopped, not running. It keeps its disk until it is deleted. Delete it:</p><p><code>${esc(instFix(v))}</code></p></div>`}`; } }
  else if (VIEW === "teams") { renderTeams(); return; }
  const out = html || `<p class="rempty">Select an item in the list to see its details.</p>`;
  // The Pipeline rail is written only when it changes, so a refresh keeps the keyboard focus a person put in it.
  if (VIEW === "pipeline" && el.dataset.h === out) return;
  el.dataset.h = out;
  rtFocus(() => { el.innerHTML = out; });
  document.body.classList.toggle("noitem", !html && ["sessions", "runners"].includes(VIEW));
}

// ── panels, keys, theme ──
function toggle(which) {
  const narrow = matchMedia(which === "side" ? "(max-width:900px)" : "(max-width:1280px)").matches;
  document.body.classList.toggle((narrow ? "show" : "no") + which);
  if (!narrow) try { localStorage.setItem("no" + which, document.body.classList.contains("no" + which) ? "1" : "0"); } catch {}
  renderHeader();
}
function select(id) {
  if (VIEW === "sessions") { location.hash = `sessions/${SESS_TAB}/${id}`; }
  else if (VIEW === "teams") {
    location.hash = id === "__all" ? "teams" : `teams/${id}`;
    if (matchMedia("(max-width:900px)").matches) { document.body.classList.add("tlist-closed"); renderHeader(); }
    return;
  }
  else {
    SEL[VIEW] = id; renderSide(); renderRight();
    if (VIEW === "teams") renderTeams();
    if (VIEW === "errors") document.getElementById("err-" + id)?.scrollIntoView({ block: "center", behavior: "smooth" });
    if (VIEW === "lessons") document.querySelector(`[data-lesson="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  if (matchMedia("(max-width:900px)").matches) document.body.classList.remove("showside");
  if (matchMedia("(max-width:1280px)").matches) document.body.classList.add("showright");
  renderHeader();
}
function openHelp(on) {
  const h = document.getElementById("help"); if (on === h.classList.contains("on")) return;
  h.classList.toggle("on", on); document.getElementById("keys-on").checked = KEYS;
  if (on) { openHelp.back = document.activeElement; document.getElementById("help-close").focus(); } else openHelp.back?.focus?.();
}
document.addEventListener("click", e => {
  const it = e.target.closest?.(".si, [data-team]"); if (it) { select(it.dataset.id ?? it.dataset.team); return; }
  if (e.target.closest?.("#tside")) toggle("side");
  if (e.target.closest?.("#tlist")) { document.body.classList.toggle("tlist-closed"); renderHeader(); }
  if (e.target.closest?.("#tright")) toggle("right");
  if (e.target.closest?.("#rclose")) { document.body.classList.remove("showright"); renderHeader(); }
  if (e.target.closest?.("#helpbtn")) openHelp(true);
  if (e.target.closest?.("#help-close") || e.target.id === "help") openHelp(false);
  if (e.target.closest?.("#theme")) cycleTheme();
});
document.addEventListener("click", e => { if (e.target.closest?.("[data-steam-clear]")) { STEAM = ""; renderSide(); } });
document.addEventListener("change", e => { if (e.target.id === "sowner") { SOWNER = e.target.value; try { localStorage.setItem("sowner", SOWNER); } catch {} renderSide(); } });
document.addEventListener("change", e => { if (e.target.id === "keys-on") { KEYS = e.target.checked; try { localStorage.setItem("keys", KEYS ? "1" : "0"); } catch {} renderSide(); } });
document.addEventListener("input", e => { if (e.target.id === "q") { Q = e.target.value; CUR = -1; renderSide(); if (VIEW === "teams") renderTeams(); } });
document.addEventListener("keydown", e => {
  const help = document.getElementById("help");
  if (e.key === "Escape" && VIEW === "pipeline" && TAB === "belts" && SEL.pipeline) { location.replace("#pipeline/belts"); return; }
  if (e.key === "Escape") { openHelp(false); document.body.classList.remove("showside", "showright"); if (e.target.id === "q") e.target.blur(); renderHeader(); return; }
  if (help.classList.contains("on")) { if (e.key === "Tab") { e.preventDefault(); document.getElementById(document.activeElement.id === "help-close" ? "keys-on" : "help-close").focus(); } return; }
  if (!KEYS || e.metaKey || e.ctrlKey || e.altKey || e.target.matches?.("input, select, textarea")) return;
  const items = [...document.querySelectorAll(".si")];
  if (/^[1-8]$/.test(e.key)) location.hash = VIEWS[e.key - 1][0];
  else if (e.key === "/") { e.preventDefault(); if (matchMedia("(max-width:900px)").matches) document.body.classList.add("showside"); document.getElementById("q")?.focus(); }
  else if (e.key === "j" || e.key === "k") { if (!items.length) return; CUR = Math.max(0, Math.min(items.length - 1, CUR + (e.key === "j" ? 1 : -1))); items.forEach((x, i) => x.classList.toggle("cur", i === CUR)); items[CUR].focus(); }
  else if (e.key === "h" || e.key === "l") { const t = VIEWS.find(v => v[0] === VIEW)[3], i = t.findIndex(x => x[0] === TAB); if (t.length) location.hash = `${VIEW}/${t[(i + (e.key === "l" ? 1 : t.length - 1)) % t.length][0]}`; }
  else if (e.key === "[") toggle("side"); else if (e.key === "]") toggle("right");
  else if (e.key === "r") document.getElementById("refresh").click();
  else if (e.key === "?") openHelp(true);
});
function paintTheme() {
  const t = document.documentElement.dataset.theme;
  document.getElementById("themelbl").textContent = t ? t[0].toUpperCase() + t.slice(1) : "System";
}
function cycleTheme() {
  const r = document.documentElement, t = r.dataset.theme;
  if (!t) r.dataset.theme = "light"; else if (t === "light") r.dataset.theme = "dark"; else delete r.dataset.theme;
  try { r.dataset.theme ? localStorage.setItem("theme", r.dataset.theme) : localStorage.removeItem("theme"); } catch {}
  paintTheme();
}
paintTheme();

// One section that throws (a snapshot shape no check has) says so in place; the rest of the page still renders.
function safeRender(fn, id) {
  try { fn(); } catch (e) { console.error(e); if (id) put(id, `<div class="emptybox">This section did not render: ${esc(e?.message ?? String(e))}. Reload, or run vm.sh rollback.</div>`); }
}
function render() {
  [[renderStatus], [renderAlerts, "attn"], [renderAgents, "s-agents"], [renderSessions, "s-sessions"], [renderTickets, "s-queue"],
   [renderLanes, "s-lanes"], [renderDone, "s-done"], [renderOvMini, "ov-mini"], [renderRunning, "s-running"], [renderSess, "s-sess"], [renderPool, "s-pool"],
   [renderNav], [renderTab], [renderHeader]].forEach(([f, id]) => safeRender(f, id));
  if (document.activeElement?.id !== "q" && !document.activeElement?.closest?.(".si")) safeRender(renderSide);
  safeRender(renderRight);
}

async function poll() {
  let data;
  try { data = await (await fetch("/api/snapshot", { cache:"no-store" })).json(); }
  catch { document.getElementById("dot").className = "dot dead"; document.getElementById("age").textContent = "server unreachable"; return; }
  SNAP = data.snapshot; AGENTS = data.agents; STATE = data;
  overlay();
  render();
  HIST_OPEN.forEach(loadHist);
  loadErrors(); loadLessons(); loadStats(); loadTeams(); loadTeamAdmin();
  if (VIEW === "teams" && TTAB === "routines" && RT.team && RT.team === SEL.teams && TEAM_ADMIN?.admin) loadRoutines(RT.team).then(() => RT.team === SEL.teams && rtPaint());
  // First load: fetch the agent output now, not on the next 5 s tick.
  if (!poll.tailed && TAIL_KEYS.length) { poll.tailed = true; pollTails(TAIL_KEYS); }
}
document.getElementById("refresh").addEventListener("click", async () => {
  try { await fetch("/api/refresh", { method: "POST" }); } catch {}
  setTimeout(poll, 1500);
});
// Sessions as they change: every 3 s, the server answers from the store with only the
// sessions written since the last cursor. The 30 s feed still brings the live agents;
// a row stays from here while it is newer than the feed's (last_activity moves on every write).
let SESS_CUR = null;
const FRESH = new Map();
function overlay() {
  if (!AGENTS) return false;
  let changed = false;
  for (const [k, r] of FRESH) {
    const list = AGENTS.sessions ?? (AGENTS.sessions = []), s = list.find(x => x.key === k);
    if (r.deleted) { if (s) { AGENTS.sessions = list.filter(x => x.key !== k); changed = true; } FRESH.delete(k); continue; }
    if (s && (s.last_activity ?? 0) >= (r.last_activity ?? 0)) { FRESH.delete(k); continue; } // the feed caught up
    const row = { ...r, agent: s?.agent ?? null, agent_alive: s?.agent_alive ?? false };
    if (s) Object.assign(s, row); else list.unshift(row);
    changed = true;
  }
  if (changed) AGENTS.sessions.sort((a, b) => (b.created ?? 0) - (a.created ?? 0));
  return changed;
}
async function pollSessions() {
  let r;
  try { r = await (await fetch(`/api/sessions${SESS_CUR == null ? "" : `?since=${SESS_CUR}`}`, { cache: "no-store" })).json(); } catch { return; }
  if (r.cursor == null) return;
  SESS_CUR = r.cursor;
  (r.rows ?? []).forEach(x => FRESH.set(x.key, x));
  if (overlay()) render();
}
route();
poll();
pollSessions();
setInterval(poll, 15000);
setInterval(pollSessions, 3000);
setInterval(() => pollTails(TAIL_KEYS), 5000);
</script>
