# profiles/fxa-android/profile.conf: the FxA Android team. FxA work as the FxA team does it, plus
# Firefox for Android (Fenix) in an emulator beside the stack and desktop Firefox: pairing, Sync
# sign-in and other flows between FxA, desktop and Android. Fenix needs KVM, so every runner is an
# x86 one with nested virtualization and the fxa-dev-android image (PIPE_ANDROID, lib/config.sh).
PIPE_PROFILE="fxa-android"
PIPE_LABEL="FxA Android Team"
PIPE_ANDROID=1
# fxa gets a PR, as for the FxA team. The GitHub App is not on mozilla-firefox/firefox, so a Fenix
# change ships as a patch (Firefox lands through Phabricator). The image holds both trees.
PIPE_REPOS=(
  "mozilla/fxa             /home/agent/fxa     work"
  "mozilla-firefox/firefox /home/agent/firefox work"
)
PIPE_STACK_DEFAULT="mozilla/fxa"
PIPE_STACK_DIR="/home/agent/fxa"
# The agent's own Fenix builds fetch Gradle and Android artifacts.
PIPE_EGRESS_EXTRA="dl.google.com maven.google.com repo.maven.apache.org plugins.gradle.org services.gradle.org maven.mozilla.org firefox-ci-tc.services.mozilla.com firefoxci.taskcluster-artifacts.net"
