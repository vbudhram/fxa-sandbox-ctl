# profiles/monitor/profile.conf: Mozilla Monitor (mozilla/blurts-server). A test
# profile for team profiles: read-only, so a session pushes nothing and opens no PR.
# It has no pipeline (no queue label), and its tickets are only read.
# See ai/docs/design-docs/2026-10-08-team-profiles.md for the full plan.

PIPE_PROFILE="monitor"
PIPE_PR_OPEN=0
# One row per repo: slug, path on the runner, role (work, dep, data or ref).
# FxA runs beside Monitor for sign-in; its stack starts from its own clone.
PIPE_REPOS=(
  "mozilla/blurts-server /home/agent/monitor work"
  "mozilla/fxa           /home/agent/fxa     dep"
)
PIPE_STACK_DIR="/home/agent/fxa"
# The dev server loads Inter from Google Fonts; lint's validate-nimbus downloads nimbus-cli.
PIPE_EGRESS_EXTRA="fonts.googleapis.com fonts.gstatic.com raw.githubusercontent.com firefox-ci-tc.services.mozilla.com firefoxci.taskcluster-artifacts.net"
