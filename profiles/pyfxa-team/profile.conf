# profiles/pyfxa-team/profile.conf: PyFxA (mozilla/PyFxA), the Python client for FxA, with
# FxA beside it. A team stack: a session picks its repos from the work rows below, and
# each repo ships on its own: a PR where the GitHub App can push, else a diff.
# PyFxA's live tests need an FxA server, and the runner runs FxA's stack locally.

PIPE_PROFILE="pyfxa-team"
PIPE_LABEL="PyFxA team"
# One row per repo: slug, path on the runner, role. Every work row can be picked.
PIPE_REPOS=(
  "mozilla/PyFxA /home/agent/pyfxa work"
  "mozilla/fxa   /home/agent/fxa   work"
)
# The repos a session gets when nobody picks: both.
PIPE_STACK_DEFAULT="mozilla/PyFxA mozilla/fxa"
# FxA's stack runs from its own clone, not from /workspace.
PIPE_STACK_DIR="/home/agent/fxa"
