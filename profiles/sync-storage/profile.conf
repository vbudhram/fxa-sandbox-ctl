# profiles/sync-storage/profile.conf: the Sync Storage team (mozilla-services/syncstorage-rs),
# Firefox Sync's storage and token server. Read-only for its first trial: a change ships as a
# patch. FxA runs beside it: its auth server verifies the tokens, and its desktop Firefox
# profile already points Sync at http://localhost:8000.
PIPE_PROFILE="sync-storage"
PIPE_LABEL="Sync Storage Team"
PIPE_PR_OPEN=0
# The repo's default branch is master.
PIPE_BASE_BRANCH="master"
PIPE_REPOS=(
  "mozilla-services/syncstorage-rs /home/agent/syncstorage work"
  "mozilla/fxa                     /home/agent/fxa         dep"
)
PIPE_STACK_DIR="/home/agent/fxa"
# The agent's cargo builds fetch crates; rustup itself runs as root in boot.sh.
PIPE_EGRESS_EXTRA="crates.io index.crates.io static.crates.io static.rust-lang.org"
